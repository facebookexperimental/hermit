# reverie-liteinst's unit tests (reverie//:reverie-liteinst-unittest) call
# Patcher::attested_with_sync and Patcher::test_with_sync, which exist only
# with this feature. Cargo enables it through reverie-liteinst's
# dev-dependency; Reindeer resolves only normal dependencies of a non-member
# crate, so the shared third-party cell enables it here, as fbsource's
# third-party build does.
features = ["test-support"]
