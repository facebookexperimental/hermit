# `ci/manifest-plan` gained Buck targets in the Buck-only pilot (dh-cqlkz),
# so Reindeer now emits a third-party rule for its `dagrun` git dependency
# (agent-utils, pinned to the submodule's gitlink). Previously this fixup
# omitted the target because nothing Buck built used it.
# dagrun's lib.rs reads env!("CARGO_PKG_VERSION") for its VERSION const.
cargo_env = ["CARGO_PKG_VERSION"]
