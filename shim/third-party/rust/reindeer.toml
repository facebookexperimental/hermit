# Configuration for Reindeer to generate Buck targets from Cargo.toml
#
# Overview of available options:
# https://github.com/facebookincubator/reindeer/blob/main/example/third-party/reindeer.toml

# Parse Rust code to work out the precise set of source files for each crate.
precise_srcs = true

# hermit's root Cargo.toml is a virtual manifest -- a workspace with no package
# of its own -- so there is no top-level target to include. Its members carry
# hand-written BUCK files in this tree, so they are not generated either.
include_top_level = false
include_workspace_members = false

# Reindeer generates targets only for crates the workspace members reach with
# the features it resolves them with: each platform's `features` below, or
# just `default` when a platform names none. hermit-cli's Buck targets enable
# backends that are optional cargo features (LiteInst, DBT), so the members
# are resolved with `third-party-backends`, the set every validation build
# compiles; with `default` alone, liteinst2 and reverie-liteinst get no target
# and the shared-cell alias step fails. A platform table here replaces
# Reindeer's whole default list, so all six of its platforms are repeated.
# scripts/check-buck-reindeer-features.rs refuses a cargo feature that a Buck
# target enables and these lists do not resolve.
[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
features = ["default", "third-party-backends"]

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
features = ["default", "third-party-backends"]

[platform.macos-x86_64]
target = "x86_64-apple-darwin"
features = ["default", "third-party-backends"]

[platform.macos-arm64]
target = "aarch64-apple-darwin"
features = ["default", "third-party-backends"]

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"
features = ["default", "third-party-backends"]

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"
features = ["default", "third-party-backends"]

[cargo]
# Support Cargo's unstable "artifact dependencies" functionality, RFC 3028.
bindeps = true

[buck]
platform_compatibility_on_all_targets = true

# Rules used for various kinds of targets.
alias = "third_party_rust_alias"
alias_with_platforms = "third_party_rust_alias"
rust_library = "third_party_rust_library"
rust_binary = "third_party_rust_binary"
cxx_library = "third_party_rust_cxx_library"
prebuilt_cxx_library = "third_party_rust_prebuilt_cxx_library"

buckfile_imports = """
load("@prelude//rust:cargo_buildscript.bzl", "buildscript_run")
load("@prelude//rust:cargo_package.bzl", "cargo")
load(
    "@shim//third-party/macros:rust_third_party.bzl",
    "third_party_rust_alias",
    "third_party_rust_binary",
    "third_party_rust_cxx_library",
    "third_party_rust_library",
    "third_party_rust_prebuilt_cxx_library",
)
"""
