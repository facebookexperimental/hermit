name: Validation Levels

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    # Weekly stress run on Sunday. Scheduled workflows run from the default branch.
    - cron: "23 05 * * 0"
  workflow_dispatch:
    inputs:
      level:
        description: Validation level to run
        required: true
        type: choice
        default: quick
        options:
          - quick
          - full
          - super

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings

jobs:
  quick:
    name: Quick validation (PR)
    if: >-
      ${{
        github.event_name == 'pull_request' ||
        (github.event_name == 'workflow_dispatch' && inputs.level == 'quick')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libunwind-dev liblzma-dev
      - name: Check namespace support
        id: namespaces
        run: |
          if unshare --user --map-root-user --pid --fork --uts --net --mount true 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::User/PID/mount namespaces unavailable; running portable validation"
          fi
      - name: Core ptrace validation
        if: steps.namespaces.outputs.available == 'true'
        run: ./validate.sh quick --no-label-pr
      - name: Portable validation
        if: steps.namespaces.outputs.available != 'true'
        run: |
          cargo build --workspace
          cargo test -p detcore
          cargo test -p hermit --lib --bins

  full:
    name: Full validation (merge gate)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    # AUTONOMOUS-BOT-IMPLEMENTED
    # TODO-HUMAN-REVIEW(#646)
    concurrency:
      group: hermit-self-hosted-pmu
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      DETCORE_TEST_RUST_LOG: "off"
      VALIDATE_GATE_TIMEOUT_SECONDS: "1200"
    steps:
      # AUTONOMOUS-BOT-IMPLEMENTED
      # TODO-HUMAN-REVIEW(#647)
      - name: Remove stale checkout locks
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE/.git" -type f -name "*.lock" -print -delete
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Dependencies
        run: |
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y gcc-c++ libunwind-devel xz-devel
            for pkg in cmake zlib-devel redis sqlite golang; do
              sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
            done
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
            sudo apt-get install -y g++ libunwind-dev liblzma-dev
            for pkg in cmake zlib1g-dev redis-server redis-tools sqlite3 golang-go; do
              sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
            done
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi
      - name: Namespace preflight
        run: >-
          unshare --user --map-root-user --pid --fork --uts --net --mount
          sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys &&
          mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
      - name: Complete validation suite
        run: ./validate.sh full --no-label-pr
      - name: Upload working-envelope JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-working-envelope
          path: envelope.json
          if-no-files-found: warn
          retention-days: 14

  super:
    name: Super validation (weekly stress)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.level == 'super')
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu]
    # AUTONOMOUS-BOT-IMPLEMENTED
    # TODO-HUMAN-REVIEW(#646)
    concurrency:
      group: hermit-self-hosted-pmu
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      DETCORE_TEST_RUST_LOG: "off"
      SUPER_REPETITIONS: "20"
      VALIDATE_GATE_TIMEOUT_SECONDS: "1200"
    steps:
      # AUTONOMOUS-BOT-IMPLEMENTED
      # TODO-HUMAN-REVIEW(#647)
      - name: Remove stale checkout locks
        run: |
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE/.git" -type f -name "*.lock" -print -delete
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y gcc-c++ libunwind-devel xz-devel
            for pkg in cmake zlib-devel; do
              sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
            done
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
            sudo apt-get install -y g++ libunwind-dev liblzma-dev
            for pkg in cmake zlib1g-dev; do
              sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; skipping"
            done
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi
      - name: Namespace preflight
        run: >-
          unshare --user --map-root-user --pid --fork --uts --net --mount
          sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys &&
          mount --bind /tmp /tmp && mount --make-rshared /tmp && umount /tmp'
      - name: Repeated determinism stress
        run: ./validate.sh super --no-label-pr
