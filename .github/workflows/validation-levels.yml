name: Validation Levels

on:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 05 * * 0"
  workflow_dispatch:
    inputs:
      level:
        description: Validation level to run
        required: true
        type: choice
        default: quick
        options: [quick, full, super]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings
  DETCORE_TEST_RUST_LOG: "off"

jobs:
  quick:
    name: Portable validation (manual)
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' && inputs.level == 'quick'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      STRICT_COMPAT_HERMIT_BIN: ${{ github.workspace }}/target/debug/hermit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hosted-validation
          cache-on-failure: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils bsdextrautils bzip2 clang cmake cpio curl dc default-jdk-headless file g++ gcc gawk git gzip iproute2 jq kmod less libunwind-dev liblzma-dev libxml2-utils lsof lua5.4 m4 make ncal netcat-openbsd nginx nodejs openssl patch perl php-cli pkg-config procps psmisc python3-full redis-server redis-tools ruby socat sqlite3 sysstat tcl time unzip util-linux util-linux-extra vim-common wget xz-utils zip zlib1g-dev zstd
      - name: Enable namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Install cargo-nextest (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: Rust components
        run: rustup component add clippy rustfmt
      - name: GitHub-hosted test lane
        run: ./validate.sh --hosted-only --no-label-pr
      - name: Upload nextest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-levels-nextest-${{ github.job }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 14

  full:
    name: Hardware validation (merge gate)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' && inputs.level == 'full')
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu, pmu-serial]
    timeout-minutes: 360
    env:
      DETCORE_TEST_RUST_LOG: "off"
      VALIDATE_GATE_TIMEOUT_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Dependencies
        run: |
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y gcc-c++ libunwind-devel xz-devel
            for pkg in cmake zlib-devel redis sqlite ruby nodejs java-latest-openjdk-devel ocaml python3-test gdb lldb; do
              sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
            done
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
            sudo apt-get install -y g++ libunwind-dev liblzma-dev
            for pkg in cmake zlib1g-dev redis-server redis-tools sqlite3 ruby nodejs default-jdk-headless ocaml-nox libpython3.12-testsuite gdb lldb; do
              sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
            done
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi
      - name: Hardware and runtime preflight
        run: |
          test -r /proc/sys/kernel/perf_event_paranoid
          test -r /dev/kvm -a -w /dev/kvm
          command -v flock
          command -v go ruby node javac java ocamlopt python3 redis-server redis-cli sqlite3 gdb lldb
          python3 -c 'import test.support'
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Self-hosted PMU and CPUID test DAG
        run: env SAFE_CI_DAG_RUNNER=agent-utils/py/bin/safe-ci-dag-runner flock /tmp/hermit-self-hosted-pmu.lock ci/run-dag.sh hardware -j 2 --perf-dir "$RUNNER_TEMP/hermit-hardware-dag-perf" -v
      - name: Upload hardware DAG performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-levels-hardware-dag-perf
          path: ${{ runner.temp }}/hermit-hardware-dag-perf
          if-no-files-found: warn
          retention-days: 14
      - name: Upload working-envelope JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-gate-working-envelope
          path: envelope.json
          if-no-files-found: warn
          retention-days: 14

  super:
    name: Super validation (weekly stress)
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.level == 'super')
        )
      }}
    runs-on: [self-hosted, Linux, X64, hermit, pmu, pmu-serial]
    timeout-minutes: 360
    env:
      DETCORE_TEST_RUST_LOG: "off"
      SUPER_REPETITIONS: "20"
      VALIDATE_GATE_TIMEOUT_SECONDS: "7200"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Dependencies
        run: |
          if command -v dnf >/dev/null; then
            sudo dnf makecache || echo "::notice::dnf makecache failed; using existing metadata"
            sudo dnf install -y gcc-c++ libunwind-devel xz-devel
            for pkg in cmake zlib-devel curl unzip patch tcl-devel java-latest-openjdk-devel; do
              sudo dnf install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
            done
          elif command -v apt-get >/dev/null; then
            sudo apt-get update || echo "::notice::apt-get update failed; using existing package index"
            sudo apt-get install -y g++ libunwind-dev liblzma-dev
            for pkg in cmake zlib1g-dev curl unzip patch tcl-dev default-jdk-headless; do
              sudo apt-get install -y "$pkg" || echo "::notice::$pkg unavailable; checking existing tools"
            done
          else
            echo "::error::Unsupported package manager"
            exit 1
          fi
      - name: PMU and namespace preflight
        run: |
          test -r /proc/sys/kernel/perf_event_paranoid
          command -v flock
          command -v java javac
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Repeated and long-form hardware validation
        run: flock /tmp/hermit-self-hosted-pmu.lock ./validate.sh super --no-label-pr
