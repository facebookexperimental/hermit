name: CI (GitHub-hosted)

on:
  push:
    branches: ["main"]
  # Keep stacked pull requests covered before they are retargeted to main.
  pull_request:
  workflow_dispatch:

# Hosted capacity is elastic. Do not add a concurrency group here: every push
# and pull-request run should finish even while the self-hosted queue backs up.
env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings
  DETCORE_TEST_RUST_LOG: "off"
  STRICT_COMPAT_HERMIT_BIN: ${{ github.workspace }}/target/debug/hermit

jobs:
  regular:
    name: Regular tests (GitHub-hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - uses: actions/checkout@v4
    - name: Initialize safe-ci-dag-runner
      run: git submodule update --init agent-utils
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: hosted-validation
        cache-on-failure: true
    - name: Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc binutils bsdextrautils bzip2 clang cmake cpio curl dc default-jdk-headless file g++ gcc gawk git gzip iproute2 jq kmod less libunwind-dev liblzma-dev libxml2-utils lsof lua5.4 m4 make ncal netcat-openbsd nginx nodejs openssl patch perl php-cli pkg-config procps psmisc python3-full redis-server redis-tools ruby socat sqlite3 sysstat tcl time unzip util-linux util-linux-extra vim-common wget xz-utils zip zlib1g-dev zstd
    - name: Enable unprivileged user and mount namespaces
      run: |
        if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi
        unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
    - name: Install cargo-nextest (prebuilt)
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
    - name: Rust components
      run: rustup component add clippy rustfmt
    - name: Portable test DAG (no PMU or CPUID interception)
      run: env SAFE_CI_DAG_RUNNER=agent-utils/py/bin/safe-ci-dag-runner ci/run-dag.sh hosted --max-mem 14G --perf-dir "$RUNNER_TEMP/hermit-dag-perf" -v
    - name: Upload DAG performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: dag-perf-${{ github.job }}
        path: ${{ runner.temp }}/hermit-dag-perf
        if-no-files-found: warn
        retention-days: 14
    - name: Upload nextest JUnit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nextest-junit-${{ github.job }}
        path: target/nextest/ci/junit.xml
        if-no-files-found: warn
        retention-days: 14
