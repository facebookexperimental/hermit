name: CI (GitHub-managed portable)

# Authoritative full-lane parallel fan-out of the portable CI DAG.
#
# WHY: the authoritative `regular` job in ci-portable.yml runs the entire 46-node
# portable DAG on ONE ubuntu-latest runner with outer concurrency 1 (serial
# nodes). Its measured wall (dag-perf-regular @c7531a83) is ~32 min: total
# node-work 1918s ~= wall 1920s, i.e. the ~2.7x core usage is entirely WITHIN
# nodes (cargo/nextest -j), not across them. The critical path is only 935s
# (build.workspace 241s -> build.dbt_release 564s -> build.liteinst_runtime 79s ->
# test.liteinst_strict 52s), so ~half the wall is left on the table
# (benchmarks/ci-dag-portable_20260802). This workflow exploits that headroom.
#
# WHAT: build the workspace + backends ONCE, publish short-lived artifacts, then
# fan every test/lint/doc block out to its own small runner that runs EXACTLY its
# assigned DAG nodes via ci/run-node.sh against the prebuilt tree. Wall time
# becomes max(build stage, slowest single shard) instead of the serial sum.
#
# The release backends compile in ONE build-release job (build.dbt_release +
# build.sabre_release + build.liteinst_runtime_release). An earlier
# build-dbt-cache -> build-dbt -> build-aux split chased a <10-min-per-build-job
# target but was a net loss: it re-compiled detcore-dbt twice and shuttled
# target/release through two extra artifact round-trips, turning one ~9.4-min node
# into ~18 min across three serial jobs (benchmarks/ci-dag-portable_20260802).
# build.dbt_release alone is ~10-12 min cold on a 4-core hosted runner, so the
# per-job target is met by a warm cargo cache, not by fragmenting the compile.
#
# CORRESPONDENCE (fail-closed): ci/check-shard-coverage.sh asserts the shard map
# (ci/portable-shards.json) assigns every non-e2e portable node to exactly one
# job; the e2e jobs are derived from the SAME audited manifest plan
# (ci/test_harness.sh plan). Node COMMANDS live only in
# ci/dag/portable.json — shards reference nodes by key, so this fan-out cannot
# silently diverge from the trusted DAG. The previous serial portable workflow
# and the partial per-cell workflow were retired when this lane was promoted.

on:
  # NO `pull_request` trigger (owner directive 2026-08-03). This is the ONLY lane
  # on GitHub's shared public hosted-runner pool (runs-on: ubuntu-latest); auto-
  # firing its ~34-min build on every PR push flooded that pool and throttled our
  # own queue (runs sat queued for hours). PRs are validated via local validate.sh
  # (the `locally-validated` label -> merge-gate), NOT a hosted PR build. Run a
  # hosted build on a PR MANUALLY via `workflow_dispatch` when actually needed.
  # The self-hosted privileged/demo lanes are handled separately.
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # QUEUE-DEPTH-1 on main: all main pushes share one group (github.ref) and
  # cancel-in-progress:false lets the RUNNING job finish while a newer main push
  # supersedes only the older PENDING run. merge_group runs get a unique head_sha
  # group. NOTHING here cancels an in-progress run.
  group: portable-${{ github.event.merge_group.head_sha || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  # Pinned to the version the fleet's dev boxes run, so the interpreter that
  # resolves `#!/usr/bin/env rust-script` here is the same one that resolved it
  # for the local validate run a PR is being compared against.
  RUST_SCRIPT_VERSION: "0.36.0"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings
  DETCORE_TEST_RUST_LOG: "off"
  DEBUG_ARTIFACT: hermit-debug-${{ github.run_id }}
  DEBUG_TARBALL: hermit-portable-debug.tzst
  RELEASE_DBT_ARTIFACT: hermit-release-dbt-${{ github.run_id }}
  RELEASE_ARTIFACT: hermit-release-${{ github.run_id }}
  RELEASE_TARBALL: hermit-portable-release.tzst

jobs:
  # -------------------------------------------------- affected-test selection
  # Consume ci/select-tests.rs (#1500) to shrink the matrix for a limited-
  # footprint pull request. FAIL-SAFE by construction: only a pull_request with a
  # resolvable base and the kill-switch off is eligible for a reduced suite.
  # merge_group, push-to-main, workflow_dispatch, a disabled kill-switch, an
  # unresolvable base, ANY tool error, or an unrecognized decision all fall
  # through to the full matrix — the exact behavior before this job existed. The
  # `skip`/`selective` decisions themselves are the tool's audited, proof-of-inert
  # judgements (docs-only => skip; a scoped source change => a dependency-closed
  # subset); this job only translates them into matrices, never widens `skip`.
  select:
    name: Select affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.sel.outputs.decision }}
      build_debug: ${{ steps.sel.outputs.build_debug }}
      build_release: ${{ steps.sel.outputs.build_release }}
      run_debug_shards: ${{ steps.sel.outputs.run_debug_shards }}
      run_release_shards: ${{ steps.sel.outputs.run_release_shards }}
      run_e2e: ${{ steps.sel.outputs.run_e2e }}
      cell_backends: ${{ steps.sel.outputs.cell_backends }}
      debug_matrix: ${{ steps.sel.outputs.debug_matrix }}
      release_matrix: ${{ steps.sel.outputs.release_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # select-tests.rs diffs base...HEAD, which needs full history.
          fetch-depth: 0
      - name: "Compute affected-test selection (fail-safe: full on any doubt)"
        id: sel
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DISABLE: ${{ vars.DISABLE_TEST_SELECTION }}
        run: |
          set -uo pipefail

          # Emit the FULL matrix straight from the audited shard map — the safe
          # default used for every non-selective path.
          emit_full() {
            local dbg rel
            dbg=$(jq -c '{include: [ .debug_shards[]   | {slug, nodes: (.nodes|join(","))} ]}' ci/portable-shards.json)
            rel=$(jq -c '{include: [ .release_shards[] | {slug, needs, nodes: (.nodes|join(","))} ]}' ci/portable-shards.json)
            {
              echo "decision=full"
              echo "build_debug=true"
              echo "build_release=true"
              echo "run_debug_shards=true"
              echo "run_release_shards=true"
              echo "run_e2e=true"
              echo "cell_backends=ALL"
              echo "debug_matrix=$dbg"
              echo "release_matrix=$rel"
            } >> "$GITHUB_OUTPUT"
            echo "selection: FULL matrix (reason: $1)" >&2
          }

          if [[ "$EVENT" != "pull_request" ]]; then emit_full "event=$EVENT is not a pull_request"; exit 0; fi
          if [[ "${DISABLE:-}" == "true" ]]; then emit_full "kill-switch vars.DISABLE_TEST_SELECTION=true"; exit 0; fi
          if [[ -z "${BASE_SHA:-}" ]]; then emit_full "no resolvable pull_request base SHA"; exit 0; fi

          if ! sel_json=$(./ci/select-tests.rs --base "$BASE_SHA" --format json 2>sel.err); then
            echo "select-tests.rs failed; falling back to full:" >&2; cat sel.err >&2
            emit_full "select-tests.rs error"; exit 0
          fi
          if ! decision=$(jq -er '.decision' <<<"$sel_json" 2>/dev/null); then
            emit_full "unparseable selection JSON"; exit 0
          fi
          case "$decision" in
            full)                emit_full "tool decision=full"; exit 0 ;;
            skip|selective)      : ;;   # handled below
            *)                   emit_full "unrecognized decision=$decision"; exit 0 ;;
          esac

          # skip or selective: derive filtered matrices by intersecting the
          # selected shard slugs with the audited shard map. Unknown slugs simply
          # match nothing (they cannot smuggle in an unlisted node).
          sel_shards=$(jq -c '.shards' <<<"$sel_json")
          backends=$(jq -r '[.cell_matrix.include[].backend] | unique | join(" ")' <<<"$sel_json")
          dbg=$(jq -c --argjson sel "$sel_shards" \
            '{include: [ .debug_shards[]   | select(.slug as $s | $sel | index($s)) | {slug, nodes: (.nodes|join(","))} ]}' \
            ci/portable-shards.json)
          rel=$(jq -c --argjson sel "$sel_shards" \
            '{include: [ .release_shards[] | select(.slug as $s | $sel | index($s)) | {slug, needs, nodes: (.nodes|join(","))} ]}' \
            ci/portable-shards.json)
          run_dbg=$(jq -e '.include|length>0' <<<"$dbg" >/dev/null 2>&1 && echo true || echo false)
          run_rel=$(jq -e '.include|length>0' <<<"$rel" >/dev/null 2>&1 && echo true || echo false)
          build_debug=$(jq -r '.build.debug' <<<"$sel_json")
          build_release=$(jq -r 'if (.build.dbt or .build.aux) then "true" else "false" end' <<<"$sel_json")
          if [[ -n "$backends" ]]; then run_e2e=true; else run_e2e=false; fi
          # e2e cells consume BOTH prebuilt trees, so force their builds on.
          if [[ "$run_e2e" == "true" ]]; then build_debug=true; build_release=true; fi
          {
            echo "decision=$decision"
            echo "build_debug=$build_debug"
            echo "build_release=$build_release"
            echo "run_debug_shards=$run_dbg"
            echo "run_release_shards=$run_rel"
            echo "run_e2e=$run_e2e"
            echo "cell_backends=$backends"
            echo "debug_matrix=$dbg"
            echo "release_matrix=$rel"
          } >> "$GITHUB_OUTPUT"
          echo "selection: decision=$decision debug_shards=$run_dbg release_shards=$run_rel e2e=$run_e2e backends=[$backends] build_debug=$build_debug build_release=$build_release" >&2

  # Exact dependency currency is part of the authoritative product-test result:
  # an old Reverie pin cannot produce current Hermit validation evidence.
  reverie-pin:
    name: Reverie pin is latest main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact latest Reverie main revision
        run: |
          set -euo pipefail
          ./ci/run-reverie-pin-check.sh --self-test
          ./ci/run-reverie-pin-check.sh
      - name: Reject a stale nested-workspace Cargo.lock before the opaque --locked build failure
        run: |
          set -euo pipefail
          nested_checker="$RUNNER_TEMP/check-nested-lockfiles"
          nested_checker_tests="$RUNNER_TEMP/check-nested-lockfiles-tests"
          RUSTUP_TOOLCHAIN=stable rustc --edition=2021 --test scripts/check-nested-lockfiles.rs -o "$nested_checker_tests"
          "$nested_checker_tests"
          RUSTUP_TOOLCHAIN=stable rustc --edition=2021 scripts/check-nested-lockfiles.rs -o "$nested_checker"
          "$nested_checker"

  # ---------------------------------------------------------------- plan (cheap)
  # Fail-closed integrity guard over the shard map itself. Runs UNCONDITIONALLY
  # (it has no `needs: select`) so a corrupt ci/portable-shards.json reds the
  # required `regular` gate even on a skip/selective run. The shard MATRICES are
  # now derived by the `select` job (full or affected-test-filtered); this job no
  # longer emits them, it only verifies the map every downstream matrix is cut
  # from is internally consistent and covers the DAG.
  plan:
    name: Verify shard/DAG coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed shard/DAG coverage guard
        run: ./ci/check-shard-coverage.sh
      - name: List audited shards (informational)
        run: |
          set -euo pipefail
          echo "debug shards:";   jq -r '.debug_shards[]   | "  - \(.slug): \(.nodes|join(", "))"' ci/portable-shards.json
          echo "release shards:"; jq -r '.release_shards[] | "  - \(.slug) (needs \(.needs)): \(.nodes|join(", "))"' ci/portable-shards.json

  # ------------------------------------------------------- preflight (no build)
  preflight:
    name: Preflight (fmt + abstraction + portability)
    needs: select
    # Selective runs still execute preflight (fmt + abstraction + portability):
    # select-tests always pins these as always-on PREFLIGHT nodes. Only a
    # proof-of-inert `skip` (e.g. docs-only) drops it.
    if: needs.select.outputs.decision != 'skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # run-node.sh now executes nodes THROUGH safe-ci-dag-runner (not a jq+bash
      # shim), so the tracked runner submodule must be present in this job too.
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - name: Rust components
        run: rustup component add rustfmt
      - name: Run preflight nodes
        env:
          RUN_NODE_PERF_DIR: ${{ runner.temp }}/run-node-perf
        run: ./ci/run-node.sh portable "$(jq -r '.preflight_nodes|join(",")' ci/portable-shards.json)"
      - name: Upload preflight node performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-node-perf-preflight
          path: ${{ runner.temp }}/run-node-perf
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------ build (debug)
  build-debug:
    name: Build debug workspace + guests once
    needs: select
    if: needs.select.outputs.build_debug != 'false'
    runs-on: ubuntu-latest
    # The selected debug DAG has a 1260s critical path. Keep the hosted job
    # outside that path plus at least 300s for setup and artifact overhead.
    timeout-minutes: 30
    outputs:
      e2e_matrix: ${{ steps.cells.outputs.matrix }}
      e2e_count: ${{ steps.cells.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-parallel-debug
          cache-on-failure: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils bsdextrautils bzip2 clang cmake cpio curl dc default-jdk-headless file g++ gcc gawk git gzip iproute2 jq kmod less libc6-dbg libelf-dev libunwind-dev liblzma-dev libxml2-utils lm-sensors lsof lua5.4 m4 make ncal netcat-openbsd nginx nodejs numactl openssl patch perl php-cli pkg-config procps psmisc python3-full redis-server redis-tools ruby socat sqlite3 sysstat tcl time unzip util-linux util-linux-extra vim-common wget xz-utils zip zlib1g-dev zstd
      - name: Rust components
        run: rustup component add clippy rustfmt
      # Reproduce the debug build nodes EXACTLY from portable.json (no drift):
      # e2e.metadata, setup.nextest, build.workspace, build.manifest_guests,
      # build.flaky_harnesses.
      - name: Run debug build nodes
        env:
          RUN_NODE_PERF_DIR: ${{ runner.temp }}/run-node-perf
        run: ./ci/run-node.sh portable "$(jq -r '.build_debug_nodes|join(",")' ci/portable-shards.json)"
      - name: Upload debug-build node performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-node-perf-build-debug
          path: ${{ runner.temp }}/run-node-perf
          if-no-files-found: warn
          retention-days: 14
      # test.regular_crates declares deps [build.workspace, setup.nextest], but
      # only the first of those crosses the job boundary reliably: build.workspace
      # ships in the prebuilt tarball below, while setup.nextest installs
      # cargo-nextest into ~/.cargo/bin, which the tarball does NOT carry. The
      # shard's only other source was a Swatinem/rust-cache restore hit, so a
      # miss (eviction, or a nightly roll changing the rust-environment hash)
      # left the shard with no `cargo nextest` at all: run 30966924323 job
      # 92185676939 logged "Restoring cache ... No cache found." and then
      # "error: no such command: `nextest`", failing in 0.1s having run zero
      # tests. Stage the binary this job just proved it has into the tarball so
      # the declared dependency travels on the channel that already works.
      # Version stays single-sourced from setup.nextest in ci/dag/portable.json.
      - name: Stage cargo-nextest for the debug shards
        run: |
          set -euo pipefail
          nextest=$(command -v cargo-nextest)
          install -Dm755 "$nextest" target/ci/bin/cargo-nextest
          target/ci/bin/cargo-nextest --version
      - name: Stage debug DBT runtime
        run: |
          set -euo pipefail
          runtime=$(
            cargo build -p detcore-dbt --message-format=json-render-diagnostics |
              jq -r '
                select(.reason == "compiler-artifact" and .target.name == "detcore_dbt")
                | .filenames[]
                | select(endswith(".so"))
              ' |
              tail -n 1
          )
          test -n "$runtime"
          test -f "$runtime"
          install -Dm755 "$runtime" target/debug/deps/libdetcore_dbt.so
      - name: Enumerate portable (mode x manifest block x backend) e2e cells
        id: cells
        env:
          # Space-separated backend allowlist from the selection job. "ALL" (or a
          # full run) means no filtering; an empty string means no e2e cells were
          # selected (e.g. a scoped change that touches only unit shards).
          CELL_BACKENDS: ${{ needs.select.outputs.cell_backends }}
        run: |
          set -euo pipefail
          # Single-dash default: an EMPTY CELL_BACKENDS is the deliberate "no e2e
          # cells selected" signal and must stay empty; only a genuinely UNSET
          # variable (which select never produces) falls back to the full set.
          backends="${CELL_BACKENDS-ALL}"
          if [[ -z "$backends" ]]; then
            # No e2e cells selected: emit an empty matrix. The e2e job and the
            # regular gate's folded-in reduction are gated off (run_e2e=false)
            # and never consume it.
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "No e2e cells selected; emitting empty cell matrix." >&2
            exit 0
          fi
          plan=$(./ci/test_harness.sh plan --lane portable --ci-only --format json)
          matrix=$(jq -c '
            [ .[] | {
                category,
                mode,
                backend: (.backend // "naked")
              }
            ]
            | unique
            | sort_by(.category, .mode, .backend)
            | { include: map(. + {
                slug: (.category + "__" + .mode + "__" + .backend)
              }) }
          ' <<<"$plan")
          if [[ "$backends" != "ALL" ]]; then
            # Keep only cells whose backend is in the selected allowlist. "naked"
            # (mode-only, no backend) cells stay whenever any backend is selected,
            # because they exercise shared harness/CLI paths a scoped change hits.
            matrix=$(jq -c --arg b "$backends" '
              ($b | split(" ")) as $keep
              | { include: [ .include[] | select((.backend == "naked") or (.backend as $x | $keep | index($x))) ] }
            ' <<<"$matrix")
          fi
          count=$(jq '.include | length' <<<"$matrix")
          [[ "$count" -gt 0 ]] || { echo "empty portable cell matrix after backend filter ($backends)" >&2; exit 1; }
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Fanning out $count portable e2e cells (backends=$backends):" >&2
          jq -r '.include[] | "  - \(.mode) x \(.category) x \(.backend)"' <<<"$matrix" >&2
      - name: Pack debug prebuilt tree
        run: |
          set -euo pipefail
          # ignored/e2e/build is created lazily by `test_harness.sh build` only
          # when at least one guest fixture stages; on trees that stage none it
          # never exists and `tar` would abort with "Cannot stat". Materialize an
          # empty dir so the pack is robust — e2e cells run with --allow-empty and
          # simply find no prebuilt fixtures, exactly as an unstaged tree intends.
          mkdir -p ignored/e2e/build
          test -f target/debug/deps/libdetcore_dbt.so
          # Cargo test shards may rewrite target/debug/deps. Keep the DBT runtime
          # in Hermit's normal install-resource location so later CLI nodes do
          # not depend on that mutable Cargo output directory.
          install -Dm755 target/debug/deps/libdetcore_dbt.so \
            target/install_pkg/rsrcs/libdetcore_dbt.so
          test -x target/ci/bin/cargo-nextest
          tar --zstd -cf "$DEBUG_TARBALL" \
            target/debug/hermit \
            target/debug/deps/libdetcore_dbt.so \
            target/install_pkg/rsrcs/libdetcore_dbt.so \
            target/ci/bin/cargo-nextest \
            ignored/e2e/build
          ls -lh "$DEBUG_TARBALL"
      - name: Upload debug prebuilt tree
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEBUG_ARTIFACT }}
          path: ${{ env.DEBUG_TARBALL }}
          if-no-files-found: error
          retention-days: 1

  # ---------------------- build (release: dbt + sabre + liteinst, ONE warm pass)
  # Consolidated from the former build-dbt-cache -> build-dbt -> build-aux serial
  # chain (see the WHAT note above). Runs every release build node in one
  # cargo-warm job, packs target/ ONCE, and publishes both the DBT install package
  # (RELEASE_DBT_ARTIFACT, consumed by the debug shards) and the full release tree
  # (RELEASE_ARTIFACT, consumed by the release/e2e/sabre shards). Both artifacts
  # carry the identical prebuilt tree, so downstream consumers are unchanged.
  build-release:
    name: Build release backends once (dbt + sabre + liteinst)
    needs: select
    if: needs.select.outputs.build_release != 'false'
    runs-on: ubuntu-latest
    # runtime_release -> liteinst_runtime_release is a 2100s selected-DAG path.
    # Keep the hosted job outside it plus at least 300s of workflow overhead.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-parallel-release
          cache-on-failure: true
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake file g++ gcc git jq libelf-dev libunwind-dev liblzma-dev make pkg-config python3-full zlib1g-dev zstd
      # Reproduce EXACTLY the release build nodes from portable.json (no drift):
      # build.dbt_release, build.sabre_release, build.liteinst_runtime_release.
      - name: Run release build nodes (dbt + sabre + liteinst)
        env:
          RUN_NODE_PERF_DIR: ${{ runner.temp }}/run-node-perf
        run: ./ci/run-node.sh portable "$(jq -r '(.build_dbt_nodes + .build_aux_nodes)|join(",")' ci/portable-shards.json)"
      - name: Upload release-build node performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-node-perf-build-release
          path: ${{ runner.temp }}/run-node-perf
          if-no-files-found: warn
          retention-days: 14
      - name: Pack full release prebuilt tree (dbt + sabre + liteinst)
        run: |
          set -euo pipefail
          tar --zstd -cf "$RELEASE_TARBALL" \
            --exclude='target/release/deps' \
            --exclude='target/release/build' \
            --exclude='target/release/incremental' \
            --exclude='target/release/.fingerprint' \
            --exclude='target/release/examples' \
            target/release \
            target/ci \
            target/install_pkg
          ls -lh "$RELEASE_TARBALL"
      - name: Upload DBT install package (debug shards)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_DBT_ARTIFACT }}
          path: ${{ env.RELEASE_TARBALL }}
          if-no-files-found: error
          retention-days: 1
      - name: Upload full release prebuilt tree (release + e2e + sabre)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: ${{ env.RELEASE_TARBALL }}
          if-no-files-found: error
          retention-days: 1

  # ------------------------------------------------- test shards (debug-backed)
  test-debug:
    name: "test: ${{ matrix.slug }}"
    needs: [select, build-debug, build-release]
    # build-release is legitimately SKIPPED when the selected debug shards need no
    # DBT runtime (build.dbt=false). A bare custom `if` would still inherit the
    # implicit success() over every need and skip this job; the explicit status
    # checks let it run when build-release was skipped, while still skipping (and
    # letting `regular` fail closed) if build-debug or a to-be-run build-release
    # actually FAILED.
    if: >-
      !cancelled()
      && needs.select.outputs.run_debug_shards != 'false'
      && needs.build-debug.result == 'success'
      && (needs.build-release.result == 'success' || needs.build-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.debug_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-parallel-debug
          save-if: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils bsdextrautils bzip2 clang cmake cpio curl dc default-jdk-headless file g++ gcc gawk git gzip iproute2 jq kmod less libc6-dbg libelf-dev libunwind-dev liblzma-dev libxml2-utils lm-sensors lsof lua5.4 m4 make ncal netcat-openbsd nginx nodejs numactl openssl patch perl php-cli pkg-config procps psmisc python3-full redis-server redis-tools ruby socat sqlite3 sysstat tcl time unzip util-linux util-linux-extra vim-common wget xz-utils zip zlib1g-dev zstd
      - name: Rust components
        run: rustup component add clippy rustfmt
      - name: Install cargo-nextest (unit-parallel shard)
        if: matrix.slug == 'unit-parallel'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      # The strict-compat node runs `./validate.sh`, which is a shim that
      # `exec`s `scripts/validate.rs` through `#!/usr/bin/env rust-script`. No
      # runner image ships that interpreter, and no workflow installed it, so
      # the exec fails with status 127 before any test runs -- a step that dies
      # in 0.1s having measured nothing, which reads like a product failure.
      #
      # Compiling the driver instead of installing the interpreter is not an
      # option here: validate.rs carries an embedded `//! ```cargo` manifest and
      # depends on `safe_ci_dag_runner` from the agent-utils submodule, so plain
      # `rustc` cannot build it the way the check.skill_discovery node builds its
      # std-only script.
      #
      # `taiki-e/install-action` is used above for cargo-nextest but does NOT
      # list rust-script in its supported-tool manifest, so it would silently
      # take an unverified fallback path. A pinned `cargo install` is slower but
      # its failure mode is legible, which is the whole point of this fix.
      - name: Install rust-script (strict-compat shard)
        if: matrix.slug == 'strict-compat'
        run: cargo install rust-script --version "${RUST_SCRIPT_VERSION}" --locked
      # Fail with a diagnostic naming the interpreter rather than letting the
      # shard die at exec. `env` reports the missing program on stderr and the
      # shell exits 127, but neither string contains "error", so the standard
      # log triage grep misses it entirely.
      - name: Verify rust-script resolves (strict-compat shard)
        if: matrix.slug == 'strict-compat'
        run: |
          if ! command -v rust-script >/dev/null; then
            echo "::error::rust-script is not on PATH; ./validate.sh execs scripts/validate.rs through it and would die at exec with status 127."
            exit 1
          fi
          echo "rust-script resolved: $(command -v rust-script) $(rust-script --version)"
      - name: Enable unprivileged user and mount namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Download debug prebuilt tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEBUG_ARTIFACT }}
          path: .
      # The DBT runtime (drrun + libreverie_dbt_client.so) lives only in the
      # release package. A selective run reaches this job with build-release
      # skipped ONLY when the tool proved no selected debug shard needs DBT
      # (build.dbt=false), so the package is downloaded and asserted only then.
      - name: Download dbt install package
        if: needs.build-release.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_DBT_ARTIFACT }}
          path: .
      - name: Unpack debug tree
        run: |
          set -euo pipefail
          tar --zstd -xf "$DEBUG_TARBALL"
          rm -f "$DEBUG_TARBALL"
          test -x target/debug/hermit
          test -f target/debug/deps/libdetcore_dbt.so
          test -f target/install_pkg/rsrcs/libdetcore_dbt.so
          test -x target/ci/bin/cargo-nextest
      # Install into CARGO_HOME/bin rather than adding target/ci/bin to PATH:
      # cargo searches $CARGO_HOME/bin BEFORE PATH when resolving
      # `cargo-<subcommand>`, so a PATH entry loses to whatever the rust-cache
      # restored and would silently run a stale cached cargo-nextest on a cache
      # HIT. Installing here covers both cases with one rule — on a miss the
      # directory holds no cargo-nextest at all (the bug this fixes), and on a
      # hit this overwrites the cached copy with the exact binary build-debug
      # validated. `cargo nextest --version` then asserts resolution up front,
      # so a provisioning problem fails here, named, instead of surfacing later
      # as an opaque node error.
      - name: Install the prebuilt cargo-nextest
        run: |
          set -euo pipefail
          install -Dm755 target/ci/bin/cargo-nextest \
            "${CARGO_HOME:-$HOME/.cargo}/bin/cargo-nextest"
          cargo nextest --version
      - name: Unpack dbt install package
        if: needs.build-release.result == 'success'
        run: |
          set -euo pipefail
          tar --zstd -xf "$RELEASE_TARBALL"
          rm -f "$RELEASE_TARBALL"
          test -x target/ci/hermit-strict
          test -x target/install_pkg/rsrcs/dynamorio/bin64/drrun
          test -f target/install_pkg/rsrcs/libreverie_dbt_client.so
      - name: Run shard nodes (${{ matrix.slug }})
        env:
          RUN_NODE_PERF_DIR: ${{ runner.temp }}/run-node-perf
        run: ./ci/run-node.sh portable "${{ matrix.nodes }}"
      - name: Upload debug shard node performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-node-perf-test-debug-${{ matrix.slug }}
          path: ${{ runner.temp }}/run-node-perf
          if-no-files-found: warn
          retention-days: 14

  # ----------------------------------------------- test shards (release-backed)
  test-release:
    name: "test: ${{ matrix.slug }}"
    needs: [select, build-release]
    if: needs.select.outputs.run_release_shards != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.release_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable-parallel-release
          save-if: false
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils bzip2 clang cmake file g++ gcc git jq libc6-dbg libelf-dev libunwind-dev liblzma-dev make pkg-config procps python3-full time zlib1g-dev zstd
      - name: Enable unprivileged user and mount namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Download full release prebuilt tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Unpack full release prebuilt tree
        run: |
          set -euo pipefail
          tar --zstd -xf "$RELEASE_TARBALL"
          rm -f "$RELEASE_TARBALL"
          test -x target/release/hermit
      - name: Run shard nodes (${{ matrix.slug }})
        env:
          RUN_NODE_PERF_DIR: ${{ runner.temp }}/run-node-perf
        run: ./ci/run-node.sh portable "${{ matrix.nodes }}"
      - name: Upload release shard node performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-node-perf-test-release-${{ matrix.slug }}
          path: ${{ runner.temp }}/run-node-perf
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------- e2e cells
  e2e:
    name: "e2e: ${{ matrix.slug }}"
    needs: [select, build-debug, build-release]
    if: needs.select.outputs.run_e2e != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.build-debug.outputs.e2e_matrix) }}
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.slug }}
      HERMIT_BIN: ${{ github.workspace }}/target/release/hermit
    steps:
      - uses: actions/checkout@v4
      - name: Initialize safe-ci-dag-runner submodule
        run: git submodule update --init agent-utils
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc binutils bsdextrautils bzip2 clang cmake cpio curl dc default-jdk-headless file g++ gcc gawk git gzip iproute2 jq kmod less libc6-dbg libelf-dev libunwind-dev liblzma-dev libxml2-utils lm-sensors lsof lua5.4 m4 make ncal netcat-openbsd nginx nodejs numactl openssl patch perl php-cli pkg-config procps psmisc python3-full redis-server redis-tools ruby socat sqlite3 sysstat tcl time unzip util-linux util-linux-extra vim-common wget xz-utils zip zlib1g-dev zstd
      - name: Enable unprivileged user and mount namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Download debug prebuilt tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.DEBUG_ARTIFACT }}
          path: .
      - name: Download full release prebuilt tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Unpack prebuilt trees
        run: |
          set -euo pipefail
          tar --zstd -xf "$DEBUG_TARBALL"; rm -f "$DEBUG_TARBALL"
          tar --zstd -xf "$RELEASE_TARBALL"; rm -f "$RELEASE_TARBALL"
          test -x target/debug/hermit
          test -x target/release/hermit
      - name: Run cell (${{ matrix.mode }} x ${{ matrix.category }} x ${{ matrix.backend }})
        run: |
          set -euo pipefail
          out="ignored/e2e/portable/${{ matrix.slug }}"
          if [[ "${{ matrix.backend }}" == "naked" ]]; then
            ./ci/test_harness.sh run --lane portable --category "${{ matrix.category }}" \
              --mode "${{ matrix.mode }}" --ci-only --allow-empty --prebuilt \
              --results "$out/results.jsonl" --junit "$out/junit.xml"
          else
            ./ci/test_harness.sh run --lane portable --category "${{ matrix.category }}" \
              --mode "${{ matrix.mode }}" --backend "${{ matrix.backend }}" \
              --ci-only --allow-empty --prebuilt \
              --results "$out/results.jsonl" --junit "$out/junit.xml"
          fi
      - name: Pack deterministic parity transport archive
        if: always()
        env:
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          out="ignored/e2e/portable/$SLUG"
          captures="ignored/e2e/runs/$E2E_RUN_ID"
          stage="ignored/parity/$SLUG/parity-v1"
          artifact="parity-v1-${{ github.run_id }}-${{ github.run_attempt }}-portable-${{ matrix.mode }}-${{ matrix.category }}-${{ matrix.backend }}.tar.zst"

          test -s "$out/results.jsonl"
          test -s "$out/junit.xml"
          test -d "$captures"
          mkdir -p "$stage/captures"
          cp "$out/results.jsonl" "$stage/results.jsonl"
          cp "$out/junit.xml" "$stage/junit.xml"
          cp "$out/summary.json" "$stage/summary.json"
          cp -a "$captures/." "$stage/captures/"
          jq -n \
            --arg repository_sha "$GITHUB_SHA" \
            --arg lane portable \
            --arg mode "${{ matrix.mode }}" \
            --arg block "${{ matrix.category }}" \
            --arg backend "${{ matrix.backend }}" \
            --arg run_key "${{ github.run_id }}-${{ github.run_attempt }}" \
            '{schema:1, repository_sha:$repository_sha, run_key:$run_key,
              lane:$lane, mode:$mode, manifest_block:$block, backend:$backend}' \
            > "$stage/index.json"
          touch "$stage/complete"
          tar --sort=name --mtime='UTC 1970-01-01' \
            --owner=0 --group=0 --numeric-owner \
            --zstd -cf "$artifact" -C "$(dirname "$stage")" parity-v1
          sha256sum "$artifact" > "$artifact.sha256"
      - name: Upload parity transport archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-v1-${{ github.run_id }}-${{ github.run_attempt }}-portable-${{ matrix.mode }}-${{ matrix.category }}-${{ matrix.backend }}
          path: |
            parity-v1-${{ github.run_id }}-${{ github.run_attempt }}-portable-${{ matrix.mode }}-${{ matrix.category }}-${{ matrix.backend }}.tar.zst
            parity-v1-${{ github.run_id }}-${{ github.run_attempt }}-portable-${{ matrix.mode }}-${{ matrix.category }}-${{ matrix.backend }}.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # These known-red exec probes stay visible and publish structured evidence,
  # but do not taint the required portable result while SaBRe's private
  # coordinator socket cannot survive guest exec.
  sabre_non_gated_parity:
    name: SaBRe non-gating exec diagnostics
    needs: [select, build-release]
    if: needs.select.outputs.build_release != 'false'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HERMIT_BIN: ${{ github.workspace }}/target/release/hermit
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bsdextrautils jq libunwind-dev liblzma-dev zstd
      - name: Enable unprivileged user and mount namespaces
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --user --map-root-user --pid --fork --uts --net --mount sh -c 'mount -t proc proc /proc && mount -t sysfs sysfs /sys && test -r /proc/self/status && test -r /sys/devices/system/cpu/online'
      - name: Download full release prebuilt tree
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_ARTIFACT }}
          path: .
      - name: Unpack full release prebuilt tree
        run: |
          set -euo pipefail
          tar --zstd -xf "$RELEASE_TARBALL"
          rm -f "$RELEASE_TARBALL"
          test -x target/release/hermit
          test -x target/install_pkg/rsrcs/sabre
      - name: Run known-red SaBRe exec probes
        run: |
          set -euo pipefail
          failures=0
          probe() {
            test_id=$1
            slug=${test_id//\//-}
            out="ignored/e2e/sabre-non-gating/$slug"
            if timeout --foreground --kill-after=5s 75s \
              ./ci/test_harness.sh run --lane portable --test "$test_id" \
                --mode verify --backend sabre --probe-disabled \
                --results "$out/results.jsonl" --junit "$out/junit.xml"; then
              echo "::notice::SaBRe diagnostic unexpectedly passed: $test_id"
            else
              failures=$((failures + 1))
              echo "::warning::Known SaBRe exec gap remains: $test_id"
            fi
          }
          probe data-handling/archive-roundtrip
          probe system-utils/date-nanoseconds
          probe system-utils/random-device
          echo "SaBRe non-gating diagnostics: $failures known-red probe(s)."
      - name: Upload SaBRe diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sabre-non-gating-${{ github.run_id }}-${{ github.run_attempt }}
          path: ignored/e2e/sabre-non-gating
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------- gate + reduce per-cell transport evidence
  # Stable required-check name. This job fails closed over the complete parallel
  # graph and is the only portable result merge-gate needs to query. It also
  # folds in the former reduce-e2e reduction to keep the gate critical path one
  # queued stage shorter.
  regular:
    name: Regular tests (GitHub-managed portable)
    needs:
      - select
      - reverie-pin
      - plan
      - preflight
      - build-debug
      - build-release
      - test-debug
      - test-release
      - e2e
    if: always()
    runs-on: ubuntu-latest
    # 10m absorbs the folded-in e2e parity reduction (former reduce-e2e job,
    # itself 5m-capped) plus the gate jq.
    timeout-minutes: 10
    steps:
      # Folded in from the former standalone `reduce-e2e` job so the portable
      # gate critical path is one queued stage shorter (select -> build -> e2e
      # -> reduce-e2e -> regular  becomes  select -> build -> e2e -> regular).
      # This is a STAGE MERGE, not an edge cut: the DATA edge to e2e is
      # preserved (regular already `needs: e2e`), and the fail-closed integrity
      # check now reds `regular` inline instead of via a separate job. Guarded
      # by run_e2e so a no-e2e selection skips reduction cleanly while the gate
      # jq below still runs.
      - name: Download all parity transport archives
        if: needs.select.outputs.run_e2e != 'false'
        uses: actions/download-artifact@v4
        with:
          pattern: parity-v1-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: transport
          merge-multiple: true
      - name: Verify completeness, checksums, and archive paths
        if: needs.select.outputs.run_e2e != 'false'
        env:
          EXPECTED: ${{ needs.build-debug.outputs.e2e_count }}
        run: |
          set -euo pipefail
          actual=$(find transport -maxdepth 1 -name '*.tar.zst' -type f | wc -l)
          [[ "$EXPECTED" =~ ^[0-9]+$ && "$actual" -eq "$EXPECTED" ]] || {
            echo "expected $EXPECTED parity archives, found $actual" >&2
            exit 1
          }

          mkdir -p reduced/expanded
          while IFS= read -r -d '' archive; do
            (cd "$(dirname "$archive")" && \
              sha256sum -c "$(basename "$archive.sha256")")
            if tar --zstd -tf "$archive" | grep -Eq '(^/|(^|/)[.][.](/|$))'; then
              echo "unsafe path in $archive" >&2
              exit 1
            fi
            slug=$(basename "$archive" .tar.zst)
            mkdir -p "reduced/expanded/$slug"
            tar --zstd -xf "$archive" -C "reduced/expanded/$slug"
            test -f "reduced/expanded/$slug/parity-v1/complete"
          done < <(find transport -maxdepth 1 -name '*.tar.zst' -type f -print0 | sort -z)

          find reduced/expanded -path '*/parity-v1/results.jsonl' -type f -print0 |
            sort -z | xargs -0 cat > reduced/results.jsonl
          jq -s '{schema:1, cells:length,
            passed:(map(select(.outcome=="PASS"))|length),
            failed:(map(select(.outcome=="FAIL"))|length),
            errors:(map(select(.outcome=="ERROR"))|length)}' \
            reduced/results.jsonl > reduced/summary.json
          while IFS= read -r -d '' junit; do
            slug=$(basename "$(dirname "$(dirname "$junit")")")
            cp "$junit" "reduced/$slug.junit.xml"
          done < <(find reduced/expanded -path '*/parity-v1/junit.xml' \
            -type f -print0 | sort -z)
      - name: Upload reduced e2e diagnostics
        if: always() && needs.select.outputs.run_e2e != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reduced/results.jsonl
            reduced/summary.json
            reduced/*.junit.xml
          if-no-files-found: error
          retention-days: 14
      - name: Require every portable DAG job to succeed or be deselected
        if: always()
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq . <<< "$RESULTS"
          # A job is acceptable only if it SUCCEEDED or was intentionally
          # deselected (skipped) by affected-test selection. A `failure` or
          # `cancelled` in ANY required job still fails closed — selection can
          # remove a job from the run, never mask a real failure. `select` itself
          # is in this set: if it dies it reports `failure`, not `skipped`, so a
          # broken selection job reds the gate instead of silently skipping tests.
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$RESULTS"

  # ------------------------------------------------------------- cleanup
  cleanup:
    name: Delete prebuilt build artifacts
    # Name every artifact consumer directly. In particular, test-debug is a
    # matrix job whose integration shard owns test.cli and the run_dbt_* tests.
    needs: [test-debug, test-release, e2e, sabre_non_gated_parity, regular]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete short-lived build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const names = new Set([
              `hermit-debug-${context.runId}`,
              `hermit-release-dbt-${context.runId}`,
              `hermit-release-${context.runId}`,
            ]);
            const arts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId }
            );
            const parityPrefix = `parity-v1-${context.runId}-${context.runAttempt}-`;
            const mine = arts.filter(a => names.has(a.name) || a.name.startsWith(parityPrefix));
            if (mine.length === 0) core.info("No build artifacts to delete (already expired or never uploaded).");
            for (const a of mine) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id,
              });
              core.info(`Deleted artifact ${a.name} (id=${a.id}, ${a.size_in_bytes} bytes).`);
            }
