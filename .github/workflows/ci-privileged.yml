name: CI (privileged)

on:
  # NO `pull_request` trigger (owner directive 2026-08-03): don't auto-fire the
  # scarce self-hosted privileged PMU lane on PRs. It is a bonus signal, NOT a
  # required merge-gate check, so removing its PR trigger cannot block landing.
  # Run it on a PR MANUALLY via `workflow_dispatch` when a privileged smoke is
  # actually needed.
  push:
    branches: [ "main" ]
  workflow_dispatch:

# QUEUE-DEPTH-1 on main: all main pushes share one group (github.ref); with
# cancel-in-progress:false GitHub lets the running job finish and supersedes only
# the older PENDING run in the group.
concurrency:
  group: privileged-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings

jobs:
  # GitHub Actions supports timeout-minutes on jobs, not at workflow scope.
  # This workflow has one independent ten-minute job, so its job timeout is
  # also stronger than the requested 60-minute workflow ceiling.
  # This scarce lane is a sub-five-minute privileged capability smoke only:
  #   * retired-conditional-branch PMU timer delivery,
  #   * CPUID faulting used to mask RDRAND/RDSEED, and
  #   * strict guest execution through /dev/kvm.
  # Full workspace builds, lint, portable tests, record/replay matrices,
  # language runtimes, debugger tests, and heavyweight QEMU boots belong on
  # portable or scheduled CI.
  privileged:
    name: Privileged capability and E2E tests
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.action != 'closed' &&
            github.event.pull_request.user.login == 'rrnewton' &&
            github.event.pull_request.draft == false
          )
        )
      }}
    runs-on: [Linux, X64, hermit, pmu]
    timeout-minutes: 10
    env:
      DETCORE_TEST_RUST_LOG: "off"

    steps:
    # AUTONOMOUS-BOT-IMPLEMENTED
    # TODO-HUMAN-REVIEW(#647)
    - name: Remove stale checkout locks
      run: |
        timeout --foreground --kill-after=5s 30s bash -euo pipefail -c '
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE/.git" -type f -name "*.lock" -print -delete
          fi
        '

    - uses: actions/checkout@v4
    - name: Trust self-hosted checkout path
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Initialize DAG runner
      run: timeout --foreground --kill-after=10s 60s git submodule update --init agent-utils
    - name: Require hardware capabilities
      run: |
        timeout --foreground --kill-after=5s 30s bash -euo pipefail -c '
          test -r /proc/sys/kernel/perf_event_paranoid
          test -r /dev/kvm -a -w /dev/kvm
          command -v cc
        '
    # The privileged lane is NOT serialized by a PMU counter lock. Measurement
    # (experiments/pmu-concurrency-ceiling-measured_20260803 in the dev-hermit
    # parent) showed the counter-exhaustion premise is false: reverie's RCB
    # counters are per-task (cpu=-1), so the kernel context-switches them and
    # only the running task's 2 counters need be resident; 32 concurrent
    # --strict --verify pinned to ONE core all pass with zero perf_event_open
    # failures. The former `flock /tmp/hermit-privileged-pmu.lock` guarded that
    # non-existent limit and had no other purpose (perf-dir is already keyed by
    # $RUNNER_TEMP; kvm nodes are capped in-DAG by resource_caps.kvm), so it is
    # removed. The `pmu-serial` runner label was retired for the same reason:
    # PMU skid is an instruction-space hardware property independent of
    # concurrency, so no determinism argument justifies serializing PMU work.
    - name: PMU, CPUID-faulting, and KVM smoke DAG
      # --allow-cgroup-failure: at the advanced runner pin, `run` boxes fail-closed
      # (exit 3) by default, but GitHub Actions (hosted AND self-hosted) sets
      # $GITHUB_ACTIONS, which makes the runner deliberately SKIP the systemd
      # --user scope; without this flag the skipped-boxing path would fail-close
      # this self-hosted lane. Opt out to best-effort UNBOXED (process-group
      # teardown only) — the pre-pin behavior — rather than regress the lane RED.
      run: timeout --foreground --kill-after=10s 360s env SAFE_CI_DAG_RUNNER=agent-utils/py/bin/safe-ci-dag-runner ci/run-dag.sh privileged -j 2 --allow-cgroup-failure --perf-dir "$RUNNER_TEMP/hermit-privileged-dag-perf" -v
    - name: Run non-gating occasional KVM probes
      id: kvm_occasional
      continue-on-error: true
      run: |
        timeout --foreground --kill-after=10s 210s \
          env HERMIT_BIN="$PWD/target/debug/hermit" \
          bash -euo pipefail -c '
            ./ci/test_harness.sh build --lane privileged --category applications \
              --ci-only --include-occasional
            ./ci/test_harness.sh run --lane privileged --category applications \
              --ci-only --include-occasional --prebuilt \
              --results ignored/e2e/privileged/occasional/results.jsonl \
              --junit ignored/e2e/privileged/occasional/junit.xml
          '
    - name: Warn when an occasional KVM probe is red
      if: steps.kvm_occasional.outcome == 'failure'
      run: echo '::warning::Known load-sensitive KVM probes are RED; see the privileged E2E artifact and fix-load-dependent-scheduling-vtime.'
    - name: Upload privileged DAG performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: privileged-dag-perf-${{ github.job }}
        path: ${{ runner.temp }}/hermit-privileged-dag-perf
        if-no-files-found: warn
        retention-days: 14
    - name: Upload privileged E2E structured results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results-${{ github.job }}
        path: ignored/e2e/privileged
        if-no-files-found: error
        retention-days: 14
