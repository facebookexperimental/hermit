name: CI (privileged)

on:
  push:
    branches: [ "main" ]
  # Keep stacked pull requests covered before they are retargeted to main. A
  # closed events still enter the workflow, but the privileged job skips them.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:

# Keep the active run and only the newest pending run for each pull request or
# branch. GitHub replaces an older pending run in the group without cancelling
# the active run when cancel-in-progress is false.
concurrency:
  group: privileged-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NEXTEST_VERSION: "0.9.100"
  RUSTFLAGS: -D warnings -C link-arg=-llzma
  RUSTDOCFLAGS: -D warnings

jobs:
  # GitHub Actions supports timeout-minutes on jobs, not at workflow scope.
  # This workflow has one independent five-minute job, so its job timeout is
  # also stronger than the requested 60-minute workflow ceiling.
  # This scarce lane is a sub-five-minute privileged capability smoke only:
  #   * retired-conditional-branch PMU timer delivery,
  #   * CPUID faulting used to mask RDRAND/RDSEED, and
  #   * strict guest execution through /dev/kvm.
  # Full workspace builds, lint, portable tests, record/replay matrices,
  # language runtimes, debugger tests, and heavyweight QEMU boots belong on
  # portable or scheduled CI.
  privileged:
    name: Privileged capability and E2E tests
    if: >-
      ${{
        github.repository == 'rrnewton/hermit' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch' ||
          (
            github.event_name == 'pull_request' &&
            github.event.action != 'closed' &&
            github.event.pull_request.user.login == 'rrnewton' &&
            github.event.pull_request.draft == false
          )
        )
      }}
    runs-on: [Linux, X64, hermit, pmu]
    timeout-minutes: 5
    env:
      DETCORE_TEST_RUST_LOG: "off"

    steps:
    # AUTONOMOUS-BOT-IMPLEMENTED
    # TODO-HUMAN-REVIEW(#647)
    - name: Remove stale checkout locks
      run: |
        timeout --foreground --kill-after=5s 30s bash -euo pipefail -c '
          if [[ -d "$GITHUB_WORKSPACE/.git" ]]; then
            find "$GITHUB_WORKSPACE/.git" -type f -name "*.lock" -print -delete
          fi
        '

    - uses: actions/checkout@v4
    - name: Trust self-hosted checkout path
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Initialize DAG runner
      run: timeout --foreground --kill-after=10s 60s git submodule update --init agent-utils
    - name: Require hardware capabilities
      run: |
        timeout --foreground --kill-after=5s 30s bash -euo pipefail -c '
          test -r /proc/sys/kernel/perf_event_paranoid
          test -r /dev/kvm -a -w /dev/kvm
          command -v cc
          command -v flock
        '
    - name: PMU, CPUID-faulting, and KVM smoke DAG
      run: timeout --foreground --kill-after=10s 270s env SAFE_CI_DAG_RUNNER=agent-utils/py/bin/safe-ci-dag-runner flock /tmp/hermit-privileged-pmu.lock ci/run-dag.sh privileged -j 2 --perf-dir "$RUNNER_TEMP/hermit-privileged-dag-perf" -v
    - name: Upload privileged DAG performance report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: privileged-dag-perf-${{ github.job }}
        path: ${{ runner.temp }}/hermit-privileged-dag-perf
        if-no-files-found: warn
        retention-days: 14
    - name: Upload privileged E2E structured results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-results-${{ github.job }}
        path: target/e2e/privileged
        if-no-files-found: error
        retention-days: 14
