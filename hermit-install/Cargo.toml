[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "3df91c9c71bdc5c77571974cbabfca20183a08de", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "3df91c9c71bdc5c77571974cbabfca20183a08de" }
