[build-dependencies]
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "7d2bee961a11dad2f6ddc0e3fa95f2f4bf8de44d", default-features = false }
reverie-sabre = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "7d2bee961a11dad2f6ddc0e3fa95f2f4bf8de44d" }
