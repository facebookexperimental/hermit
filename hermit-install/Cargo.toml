[build-dependencies]
reverie-dbt = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b74df9352dca3d70d68e8ac4801df9089c5b8139", default-features = false }
reverie-sabre = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b74df9352dca3d70d68e8ac4801df9089c5b8139" }
