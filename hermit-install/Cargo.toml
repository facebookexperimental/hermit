[package]
name = "hermit-install"
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
reverie-liteinst-artifact = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "38a30d7a4912d046487d4a517ffad092cfb5d4c0", default-features = false }
serde_json = "1"
toml = "0.8"

[build-dependencies]
reverie-dbt = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "38a30d7a4912d046487d4a517ffad092cfb5d4c0", default-features = false }
reverie-sabre = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "38a30d7a4912d046487d4a517ffad092cfb5d4c0" }
