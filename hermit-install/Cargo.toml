[package]
name = "hermit-install"
version = "0.5.7"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
path = "src/lib.rs"

[features]
# Core staging includes the first-party LiteInst runtime.
default = []

[dependencies]
reverie-liteinst-artifact = { version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "56c42cab2cbedc312706869e1848a818c32675d3", default-features = false }
serde_json = "1"
toml = "0.8"
