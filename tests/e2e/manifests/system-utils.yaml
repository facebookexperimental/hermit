schema: 3
bucket: system-utils
test:
  - id: system-utils/clock-determinism
    description: clock_gettime/gettimeofday output is identical across repeated Hermit runs
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/c/clock_determinism.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    build:
      cflags:
        - -O0
        - -D_GNU_SOURCE
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The date-nanoseconds entry owns the native clock nondeterminism control
      verify:
        ci:
          ptrace: true
          kvm: true
          liteinst: false
        ci_disabled_reason:
          liteinst: {"result": "determinism-failure", "evidence": "8f6d8a57d6a8e4ef7fa0ae14c16e2a494a2c0ab5; task ov-backend-ratchet-fanout", "reason": "Exact-head pipe-capacity canonical verification diverged with its first divergence at a /proc/self/maps COMMIT (turn 10), matching three prior LiteInst demotions; durable population evidence measured 20 of 26 LiteInst candidates diverging at that shared startup point and later saw 2 of the 6 apparent PASSx3 survivors fail, so a single matching pair does not qualify this verify population."}
        backends_enabled:
          - ptrace
          - kvm
          - liteinst
        backends_disabled:
          dbt: Enable after the ptrace baseline for direct C guests is trusted
          sabre: SaBRe does not intercept RDTSCP; clock probes can leak raw host TSC
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Clock replay divergence is tracked separately from this determinism entry
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The clock matrix guest is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: true
        args:
          - --base-env=minimal
          - --no-virtualize-cpuid
          - --max-timeslice=disabled
        assert:
          runs: 5
          repeat_identical: true
        backends_enabled:
          - ptrace
          - liteinst
        backends_disabled:
          dbt: The custom clock matrix baseline is ptrace-only
          kvm: The custom clock matrix baseline is ptrace-only
          sabre: The custom clock matrix baseline is ptrace-only
