  - id: system-utils/example-date
    description: The user-facing nanosecond date example repeats under every applicable backend
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - date
    occasional: false
    direct: ./examples/date.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The existing date-nanoseconds test owns the native-variation assertion
      verify:
        ci: true
        backends_enabled:
          - ptrace
          - kvm
        backends_disabled:
          dbt: DBT wedges when the guest execs a new program image, and this script ends in `exec /usr/bin/date`. Measured 2026-08-24 - the run never exits and emits zero DETLOG records after "[dbt backend] Detcore Tool active"; a cell timeout then misreports it as "failed to launch drrun". Note DBT refuses execveat legibly with ENOSYS (tests/c/dbt_execveat_unsupported.c passes), so it is execve specifically that hangs
          sabre: Required date/clock virtual-time support remains owner-gated for SaBRe
          liteinst: The preload runtime cannot survive the date script's post-start exec
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns the examples-directory parity contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The example is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
