  - id: system-utils/stat-script-root
    description: "tests/e2e/system-utils/stat-root.sh is the run's root image, executed by its #!/usr/bin/bash line, and prints the name its own /proc/<pid>/stat, the Name: line of its /proc/<pid>/status and its /proc/<pid>/comm show, read by the shell itself. Linux names the task by the script's file name (kbasename(bprm->filename), fs/exec.c begin_new_exec), so all three say stat-root.sh; the ptrace row is the native output. Detcore renders the stat (package K slice D4c-1): on ptrace and DBT its name is the kernel's, on KVM Detcore's record from the image's AT_EXECFN, the script's path, so stat says stat-root.sh on ptrace and KVM. On KVM Detcore also renders the read of the comm file from the same record (package K slice A+), so comm says stat-root.sh there too. The KVM and DBT rows are measured under Hermit (strict verification at bitwise parity). The DBT row records a named DBT difference that is not Detcore's: DynamoRIO runs a #! script root through its interpreter and names the task by the basename of the image it runs (its loader's PR_SET_NAME), so the kernel's name, which stat, status and comm all show there, is bash (https://github.com/rrnewton/hermit/issues/4595). The KVM row records a named difference that is not Detcore's: the KVM executor, which still serves status and PR_GET_NAME there, names the root image by the resolved argv[0], which Hermit's launcher rewrites to the interpreter for a #! script (reverie-kvm elf.rs initial_thread_name), so its status says bash, while the comm file Detcore renders from its record says stat-root.sh, as stat does: the executor's name, which PR_GET_NAME also returns, differs from the record's for such a root (https://github.com/rrnewton/reverie/issues/1106)"
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - bash
    occasional: false
    program: tests/e2e/system-utils/stat-root.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      verify:
        ci:
          ptrace: true
          dbt: true
          kvm: true
          in-guest-trap: true
          liteinst: true
        backends_enabled:
          - ptrace
          - dbt
          - kvm
          - in-guest-trap
          - liteinst
        backends_disabled:
          sabre: "NOT-QUALIFIED: this cell checks the name Detcore's rendered stat gives a #! script root against the kernel's status and comm; SaBRe has not been run on it, and SaBRe is a drop candidate under the owner's ruling."
        expected_stdout:
          ptrace: "stat=stat-root.sh status=stat-root.sh comm=stat-root.sh\n"
          dbt: "stat=bash status=bash comm=bash\n"
          kvm: "stat=stat-root.sh status=bash comm=stat-root.sh\n"
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each was CLEAN on the nightly pressure sweeps of 2026-10-29 and 2026-10-30 (https://github.com/rrnewton/hermit/issues/3745)
