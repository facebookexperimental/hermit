schema: 3
bucket: system-utils
# This bucket runs inside the pinned hermetic root like compat: the
# run-in-pinned-root wrapper enters the image and hermit runs in plain
# open mode there. The bucket deliberately does not declare an image:
# the harness itself starts inside the pinned root, where no podman
# store exists for hermit --image (see issue 5030).
test:
  - id: system-utils/clock-determinism
    description: clock_gettime/gettimeofday output is identical across repeated Hermit runs
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/c/clock_determinism.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    build:
      cflags:
        - -O0
        - -D_GNU_SOURCE
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The date-nanoseconds entry owns the native clock nondeterminism control
      verify:
        ci:
          ptrace: true
          sabre: true
          kvm: true
          dbt: true
          liteinst: true
          in-guest-trap: true
        backends_enabled:
          - ptrace
          - sabre
          - kvm
          - dbt
          - liteinst
          - in-guest-trap
        backends_disabled: {}
        expected_stdout_contains:
          ptrace: "clock matrix success\n"
          dbt: "clock matrix success\n"
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each passed 10 of 10 verify runs that way in a local survey on 2026-10-08 (https://github.com/rrnewton/hermit/issues/3745)
      replay:
        ci: true
        backends_enabled: [ptrace]
        backends_disabled:
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The clock matrix guest is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: true
        args:
          - --base-env=minimal
          - --no-virtualize-cpuid
          - --max-timeslice=disabled
        assert:
          runs: 5
          repeat_identical: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: The custom clock matrix baseline is ptrace-only
          kvm: The custom clock matrix baseline is ptrace-only
          sabre: The custom clock matrix baseline is ptrace-only
          liteinst: Owner reset 2026-10-04 - the ptrace-owned LiteInst hybrid is being replaced by in-guest Detcore, and LiteInst cells return only on the new architecture (https://github.com/rrnewton/hermit/issues/3745, step 1 of https://github.com/rrnewton/hermit/issues/3520)
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
  - id: system-utils/date-nanoseconds
    description: A valid wall-clock timestamp varies natively and repeats under Hermit
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
    occasional: false
    program: tests/e2e/system-utils/date-nanoseconds.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        runs: 3
        assert:
          min_distinct: 2
        backends_enabled:
          - native
        backends_disabled: {}
        ci_disabled_reason: This native control is not selected by ordinary validation; add it to ci/expected-e2e-plan.json only after repeated runs satisfy its declared outcome oracle.
      verify:
        ci:
          ptrace: true
          kvm: true
          dbt: true
        backends_enabled:
          - ptrace
          - kvm
          - dbt
        backends_disabled:
          liteinst: LiteInst coverage is owned by its backend compatibility partition
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
          sabre: The exec socket is fixed, but required date/clock virtual-time support remains owner-gated for SaBRe
      replay:
        ci: true
        backends_enabled: [ptrace]
        backends_disabled:
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: A single-threaded wall-clock probe has no scheduling oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
