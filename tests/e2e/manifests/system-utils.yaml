    modes:
      naked:
        ci: false
        runs: 3
        assert:
          min_distinct: 2
        backends_enabled:
          - native
        backends_disabled: {}
        ci_disabled_reason: This native control is not selected by ordinary validation; add it to ci/expected-e2e-plan.json only after repeated runs satisfy its declared outcome oracle.
      verify:
        ci:
          ptrace: true
          kvm: true
        backends_enabled:
          - ptrace
          - kvm
        backends_disabled:
          dbt: DBT coverage is owned by its backend parity partition
          liteinst: LiteInst coverage is owned by its backend compatibility partition
          sabre: The exec socket is fixed, but required date/clock virtual-time support remains owner-gated for SaBRe
      replay:
