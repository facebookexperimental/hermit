          dbt: No custom edge-case arguments have been calibrated for this guest
          kvm: No custom edge-case arguments have been calibrated for this guest
          sabre: No custom edge-case arguments have been calibrated for this guest
          liteinst: No custom edge-case arguments have been calibrated for this guest
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
