  - id: language-runtimes/example-python-random
    description: The user-facing Python random example repeats deterministically under each applicable backend
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - python3
    occasional: false
    direct:
      - ./examples/rand.py
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The existing python-random test owns the native-variation assertion
      verify:
        timeout_seconds:
          dbt: 95
        cpu_timeout_seconds:
          dbt: 33
        slow_reason:
          dbt: "DBT (DynamoRIO) costs this Python start far more than the other backends (about 1 second on each of them), and more again in coordinator-launched full validations on the development host (named in docs/TESTING_ENVIRONMENTS.md, Named measurement hosts), where the host's BPF file-open hook takes a slow path. Across its 249 passing coordinator runs from 2026-10-11 to 2026-10-25, nearest-rank p90 was 17.275 CPU and 23.556 wall seconds (max 21.308 CPU, 53.146 wall); ceil(1.5x CPU)=26 and ceil(4x wall)=95. The default 22-second CPU bound stopped the validation of f8adb23a at 22.0 CPU seconds, and the 57-second wall bound stopped two runs at about 57 seconds with 7 CPU seconds used. The CPU bound is 33, ceil(1.5 x 22.0), above the required 26; the wall bound is the required 95."
        ci:
          ptrace: true
          # DBT Python-random: 20/20 strict canonical pairs at c0216c84; unchanged example.
          dbt: true
          kvm: true
          sabre: true
          liteinst: true
          in-guest-trap: true
        backends_enabled:
          - ptrace
          - dbt
          - kvm
          - sabre
          - liteinst
          - in-guest-trap
        backends_disabled: {}
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each passed 10 of 10 verify runs that way in a local survey on 2026-10-08 (https://github.com/rrnewton/hermit/issues/3745)
      replay:
        ci: true
        backends_enabled: [ptrace]
        backends_disabled:
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The example is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
