  - id: language-runtimes/bash-loop-pipe-time
    description: Bash file I/O, loops, pipelines, hashing, and time repeat under Hermit
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - bash
    occasional: false
    program: tests/e2e/language-runtimes/bash-loop-pipe-time.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This regression establishes Hermit verification, not native nondeterminism
      verify:
        ci: true
        backends_enabled:
          - ptrace
          - dbt
          - kvm
        backends_disabled:
          sabre: SaBRe requires its external runtime
          liteinst: LiteInst Bash qualification is tracked by backend compatibility
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
