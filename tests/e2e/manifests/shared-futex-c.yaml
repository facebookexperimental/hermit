schema: 3
bucket: shared-futex-c
test:
  - id: shared-futex-c/qemu-exec-init
    description: Strict verification for tests/shared-futex-verify/qemu_exec_init.c
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/shared-futex-verify/qemu_exec_init.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    build:
      cflags:
        - -D_GNU_SOURCE
        - -pthread
        - -Wno-error=unused-parameter
        - -Wno-error=unused-function
        - -Wno-error=unused-variable
        - -Wno-error=attributes
        - -Wno-error=unknown-pragmas
        - -Wno-error=sign-compare
        - -std=gnu11
        - -nostdlib
        - -static
        - -fno-stack-protector
        - -fno-pie
        - -no-pie
    modes:
      verify:
        ci:
          ptrace: false
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Initial C-corpus migration preserves the established ptrace baseline; qualify DBT separately
          kvm: Initial C-corpus migration preserves the established ptrace baseline; qualify KVM separately
          sabre: Initial C-corpus migration preserves the established ptrace baseline; qualify SaBRe separately
          liteinst: Initial C-corpus migration preserves the established ptrace baseline; qualify LiteInst separately
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
        ci_disabled_reason:
          ptrace: {"evidence": "TaskGraph list-the-never-measured-red-cells-by-test-id-mode-backend; Hermit 5b811757980b9cab599206c047560a7962176a6b; repeated canonical verification summary sha256 944bf8af55c1102757a068818e840ee7f8e083f9855f9e302b1eddfd363e4cb4", "reason": "Repeated canonical verification retained an understood infrastructure failure; this cell did not pass every repetition cleanly. Retained detail: verification recorded no comparison at all (verdict=no_result), so there is no canonical INFO evidence to admit", "result": "infrastructure-error"}
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This migration inventories strict verification; it does not assert native nondeterminism
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Record/replay qualification is separate from the initial strict-verification migration
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Chaos scheduling is only meaningful for guests with an explicit schedule-diversity oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No custom edge-case arguments have been calibrated for this C guest
          dbt: No custom edge-case arguments have been calibrated for this C guest
          kvm: No custom edge-case arguments have been calibrated for this C guest
          sabre: No custom edge-case arguments have been calibrated for this C guest
          liteinst: No custom edge-case arguments have been calibrated for this C guest
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
  - id: shared-futex-c/qemu-hello
    description: Strict verification for tests/shared-futex-verify/qemu_hello.c
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/shared-futex-verify/qemu_hello.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      verify:
        ci:
          ptrace: true
          kvm: true
          dbt: true
          liteinst: true
          in-guest-trap: true
        backends_enabled:
          - ptrace
          - kvm
          - dbt
          - liteinst
          - in-guest-trap
        backends_disabled:
          sabre: Initial C-corpus migration preserves the established ptrace baseline; qualify SaBRe separately
        expected_guest_exit:
          code: 7
          reason: The guest returns 7 on purpose so the QEMU launcher test can prove it captured an exact nonzero exit status across both verify runs.
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each passed 10 of 10 verify runs that way in a local survey on 2026-10-08 (https://github.com/rrnewton/hermit/issues/3745)
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This migration inventories strict verification; it does not assert native nondeterminism
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Record/replay qualification is separate from the initial strict-verification migration
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Chaos scheduling is only meaningful for guests with an explicit schedule-diversity oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No custom edge-case arguments have been calibrated for this C guest
          dbt: No custom edge-case arguments have been calibrated for this C guest
          kvm: No custom edge-case arguments have been calibrated for this C guest
          sabre: No custom edge-case arguments have been calibrated for this C guest
          liteinst: No custom edge-case arguments have been calibrated for this C guest
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
