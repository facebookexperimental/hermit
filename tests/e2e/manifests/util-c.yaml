schema: 3
bucket: util-c
test:
  - id: util-c/pmu-skid
    description: Strict verification for tests/util/pmu_skid.c
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/util/pmu_skid.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      verify:
        ci:
          ptrace: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Initial C-corpus migration preserves the established ptrace baseline; qualify DBT separately
          kvm: Initial C-corpus migration preserves the established ptrace baseline; qualify KVM separately
          sabre: Initial C-corpus migration preserves the established ptrace baseline; qualify SaBRe separately
          liteinst: Initial C-corpus migration preserves the established ptrace baseline; qualify LiteInst separately
        expected_guest_exit:
          code: 3
          reason: Detcore refuses guest ptrace with a deterministic EPERM (the privileged-observation boundary), so PTRACE_TRACEME fails in the child and this host PMU diagnostic exits with its dedicated refused-ptrace status 3 (EXIT_PTRACE_REFUSED), distinct from the EXIT_FAILURE that every other failure path returns.
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This migration inventories strict verification; it does not assert native nondeterminism
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Record/replay qualification is separate from the initial strict-verification migration
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Chaos scheduling is only meaningful for guests with an explicit schedule-diversity oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No custom edge-case arguments have been calibrated for this C guest
          dbt: No custom edge-case arguments have been calibrated for this C guest
          kvm: No custom edge-case arguments have been calibrated for this C guest
          sabre: No custom edge-case arguments have been calibrated for this C guest
          liteinst: No custom edge-case arguments have been calibrated for this C guest
