          native: The byte counts and the content compare are deterministic by construction, so native repetition is not a nondeterminism contract
        ci_disabled_reason: 'NOT-EXERCISED: this mode is outside the measured strict-verification contract for this guest.'
      verify:
        ci: true
        timeout_seconds:
          ptrace: 58
        cpu_timeout_seconds:
          ptrace: 22
        slow_reason:
          ptrace: Across 60 retained typed passing rows, nearest-rank p90 was 14.275 wall seconds and 12.732855 CPU seconds; ceil(4x wall)=58 while the owner-approved 22-second CPU default already covers ceil(1.5x CPU)=20.
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Established on ptrace first; other backends ratchet against this shared entry
          kvm: KVM requires the privileged runner and does not start on the validation host
          sabre: Established on ptrace first; other backends ratchet against this shared entry
          liteinst: Established on ptrace first; other backends ratchet against this shared entry
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Record/replay qualification is tracked separately from this strict-verify entry
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
        ci_disabled_reason: 'NOT-EXERCISED: this mode is outside the measured strict-verification contract for this guest.'
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Chaos scheduling does not add a second oracle to a single-process byte copy
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
        ci_disabled_reason: 'NOT-EXERCISED: this mode is outside the measured strict-verification contract for this guest.'
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No custom edge-case arguments have been calibrated for this entry
          dbt: No custom edge-case arguments have been calibrated for this entry
          kvm: No custom edge-case arguments have been calibrated for this entry
          sabre: No custom edge-case arguments have been calibrated for this entry
          liteinst: No custom edge-case arguments have been calibrated for this entry
        ci_disabled_reason: 'NOT-EXERCISED: this mode is outside the measured strict-verification contract for this guest.'
