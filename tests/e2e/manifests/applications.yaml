schema: 3
bucket: applications
test:
  - id: applications/timed-progress-bar
    description: A time-driven Python application completes identically under verification
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - python3
    occasional: false
    direct:
      - ./examples/timed-progress-bar.py
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Elapsed time drives progress but final output is intentionally stable
      verify:
        ci: true
        timeout_seconds:
          ptrace: 91
          kvm: 80
        cpu_timeout_seconds:
          ptrace: 32
          kvm: 24
        slow_reason:
          ptrace: The ptrace workload runs the same 53 busy-wait and print intervals at 5 ms as KVM instead of 50 at 20 ms. Every clock read is a ptrace stop, and remote-execution hosts differ widely in what a stop costs. On 2026-10-05 the default workload took about 7 CPU seconds on one development host but reached the 32-second CPU bound on one remote-execution host (both named in docs/TESTING_ENVIRONMENTS.md, Named measurement hosts), where zstd-multithread verify/ptrace ran 5.7x slower than at 3446e8af. Across 3 passing first-attempt test-harness qualification repetitions with Hermit built at d1744e9fc07e5262a93c19971947a6b168b61252, nearest-rank p90 was 2.828 wall seconds and 2.636419 CPU seconds; ceil(4x wall)=12 and ceil(1.5x CPU)=4, both covered by the retained 91/32 bounds, which were set from 60 earlier rows with a p90 of 22.531 wall and 20.710660 CPU seconds and are kept as remote-execution headroom. No CI cell now runs the default 50 x 20 ms workload under ptrace; applications/example-timed-progress-bar, which does, is not CI-selected.
          kvm: The KVM-only workload runs 53 busy-wait and print intervals at 5 ms instead of 50 at 20 ms, reducing VM-exit-heavy clock reads while preserving the baseline's 200-turn instrumented scheduler coverage. Across 3 clean qualification repetitions at Hermit f190205a7b3e65e7ebf347ba0875b668fd72d9a7, nearest-rank p90 was 13.753 wall seconds and 12.809181 CPU seconds; ceil(4x wall)=56 and ceil(1.5x CPU)=20, both covered by the retained 80/24 bounds.
        backends_enabled:
          - ptrace
          - kvm
          - dbt
          - liteinst
          - in-guest-trap
        guest_args:
          ptrace:
            - "53"
            - "5"
          kvm:
            - "53"
            - "5"
          dbt:
            - "53"
            - "5"
          liteinst:
            - "53"
            - "5"
          in-guest-trap:
            - "53"
            - "5"
        backends_disabled:
          sabre: SaBRe does not yet determinize busy-wait polling on virtual wall-clock advancement; main validation has observed verify failure under load
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each passed 10 of 10 verify runs that way in a local survey on 2026-10-08 with the default 50 x 20 ms workload, then 3 of 3 with the 53 x 5 ms workload ptrace, KVM and DBT run, which they now share (https://github.com/rrnewton/hermit/issues/3745)
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Focused time and entropy sentinels own the blocking replay contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The application is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
  - id: applications/example-timed-progress-bar
    description: The user-facing timed progress example repeats deterministically under each applicable backend
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - python3
    occasional: false
    direct:
      - ./examples/timed-progress-bar.py
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Elapsed time changes, but the final progress-bar output is intentionally stable
      verify:
        ci:
          ptrace: false
          dbt: false
          kvm: false
          liteinst: true
          in-guest-trap: true
        backends_enabled:
          - ptrace
          - dbt
          - kvm
          - liteinst
          - in-guest-trap
        backends_disabled:
          sabre: SaBRe does not yet determinize busy-wait polling on virtual wall-clock advancement; keep the identical example workload unqualified
        ci_disabled_reason:
          ptrace:
            result: timeout
            evidence: local 10-repetition ptrace verify at Hermit 46163a3ea878f5eac9184f0d1e70a856792d6dfe, 10 of 10 PASS, median 15.8 and maximum 18.1 wall seconds (https://github.com/rrnewton/dev-hermit/issues/564)
            reason: >-
              Passes repeated verification, but this default 50 x 20 ms workload
              reached the 32-second CPU bound under ptrace on a remote-execution
              host on 2026-10-05, so full validation does not select it;
              applications/timed-progress-bar runs the 53 x 5 ms variant there
          kvm: {"evidence": "TaskGraph list-the-never-measured-red-cells-by-test-id-mode-backend; Hermit 5b811757980b9cab599206c047560a7962176a6b; repeated canonical verification summary sha256 944bf8af55c1102757a068818e840ee7f8e083f9855f9e302b1eddfd363e4cb4", "reason": "Repeated canonical verification retained an understood infrastructure failure; this cell did not pass every repetition cleanly. Retained detail: verification recorded no comparison at all (verdict=no_result), so there is no canonical INFO evidence to admit", "result": "infrastructure-error"}
          dbt:
            result: infrastructure-error
            evidence: RUN1598 at Hermit cd976f804de7568e34dc731b859dd7a5a1c1c0b9
            reason: Canonical full validation could not start either DBT attempt because this backend cannot isolate the required /test workdir; this is an infrastructure result, not a product divergence.
        hermit_args:
          liteinst:
            - --max-timeslice=disabled
          in-guest-trap:
            - --max-timeslice=disabled
        hermit_args_reason: In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption timer, so these cells run with the maximum timeslice disabled; each passed 10 of 10 verify runs that way in a local survey on 2026-10-08 (https://github.com/rrnewton/hermit/issues/3745)
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns the examples-directory parity contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The example is single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
  - id: applications/kvm-python-examples
    description: User-facing Python examples run identically with the system interpreter under KVM
    lane: privileged
    requires:
      - linux
      - x86_64
      - kvm
      - python3
    occasional: false
    program: tests/e2e/applications/kvm-python-examples.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: The portable Python-random test owns the native nondeterminism control
      verify:
        ci:
          kvm: false
        timeout_seconds:
          kvm: 74
        cpu_timeout_seconds:
          kvm: 25
        slow_reason:
          kvm: Across 58 retained typed passing rows, nearest-rank p90 was 18.271 wall seconds and 16.656796 CPU seconds; ceil(4x wall)=74 and ceil(1.5x CPU)=25.
        backends_enabled:
          - kvm
        backends_disabled:
          ptrace: This test specifically asserts the KVM execution path
          dbt: This test specifically asserts the KVM execution path
          sabre: This test specifically asserts the KVM execution path
          liteinst: This test specifically asserts the KVM execution path
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
        ci_disabled_reason:
          kvm:
            result: determinism-failure
            evidence: RUN1709 at Hermit 8c2bb5620f13e5d351e7bdb5d20c8dcec1f3eaba
            reason: Both canonical full-validation attempts diverged at turn 34, record 560, syscall 239, so KVM remains enabled but is not selected by CI pending separate qualification.
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: This is a KVM integration test
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The examples are single-threaded
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
