schema: 3
bucket: rr
test:
  - id: rr/simple
    description: Upstream rr simple guest prints EXIT-SUCCESS (Batch 0 spike for the rr pressure corpus)
    labels: [pressure]
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
      - python3
    occasional: false
    program: third-party/rr/src/test/simple.c
    preprocessors: [rr-generated-headers]
    build:
      cflags:
        - -std=gnu11
        - -O0
        - -g3
        - -Wno-error
        - -D_FILE_OFFSET_BITS=64
        - -pthread
        - -Ithird-party/rr/src/test
        - -Ithird-party/rr/src/preload
        - -Ithird-party/rr/include
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        ci_disabled_reason: 'NOT-EXERCISED: rr guests assert deterministic Hermit behavior; there is no naked nondeterminism oracle.'
        backends_enabled: []
        backends_disabled:
          native: The guest prints a fixed EXIT-SUCCESS line by construction
      verify:
        ci: false
        ci_disabled_reason: 'Pressure tier: measured run-only green in the Phase 1 sample on debug Hermit; hermetic replay/verify pass plus 2 clean pressure nights required for super.'
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: rr corpus qualifies ptrace first; DBT ratchets separately
          kvm: rr corpus qualifies ptrace first; KVM ratchets separately
          sabre: rr corpus qualifies ptrace first; SaBRe ratchets separately
          liteinst: rr corpus qualifies ptrace first; LiteInst ratchets separately
          in-guest-trap: rr corpus qualifies ptrace first; in-guest-trap ratchets separately
      replay:
        ci: false
        ci_disabled_reason: 'Pressure tier: measured run-only green in the Phase 1 sample on debug Hermit; hermetic replay/verify pass plus 2 clean pressure nights required for super.'
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        ci_disabled_reason: 'NOT-EXERCISED: single-threaded guest has no schedule-diversity oracle.'
        backends_enabled: []
        backends_disabled:
          ptrace: Single-threaded guest has no schedule diversity to explore
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
