id = "backend-parity-c/stat-metadata-identity"
description = "Contract fixture: stat/fstat/lstat/statx metadata (st_ino, st_dev, timestamps incl. statx btime, st_nlink, st_blocks) does not leak host state; timestamps come from continuous virtual time (identical double-run AND still advancing within a run); includes a branch on an inode comparison."
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 120
occasional = false
