occasional = false
program = "tests/backend-parity/fixtures/personality_domain.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.build]
cflags = ["-D_GNU_SOURCE"]

[test.modes.verify]
ci = true
