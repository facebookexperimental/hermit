schema = 2
bucket = "backend-parity-c"

[[test]]
id = "backend-parity-c/cpuid-probe"
description = "Strict verification for tests/backend-parity/fixtures/cpuid_probe.c"
lane = "privileged"
requires = ["linux", "x86_64", "userns", "ptrace", "cpuid", "cc"]
timeout_seconds = 90
occasional = false
program = "tests/backend-parity/fixtures/cpuid_probe.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
ci = false
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Initial C-corpus migration preserves the established ptrace baseline; qualify DBI separately"
kvm = "Initial C-corpus migration preserves the established ptrace baseline; qualify KVM separately"
sabre = "Initial C-corpus migration preserves the established ptrace baseline; qualify SaBRe separately"
liteinst = "Initial C-corpus migration preserves the established ptrace baseline; qualify LiteInst separately"

[test.modes.naked]
ci = false
backends_enabled = []
[test.modes.naked.backends_disabled]
native = "This migration inventories strict verification; it does not assert native nondeterminism"

[test.modes.replay]
ci = false
backends_enabled = []
[test.modes.replay.backends_disabled]
ptrace = "Record/replay qualification is separate from the initial strict-verification migration"
dbi = "Record/replay is unsupported by DBI"
kvm = "Record/replay is unsupported by KVM"
sabre = "Record/replay is unsupported by SaBRe"
liteinst = "Record/replay is unsupported by LiteInst"

[test.modes.chaos]
