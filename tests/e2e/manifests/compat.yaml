schema: 3
bucket: compat
# The portable strict compatibility corpus: real programs installed on the
# validation host, each run under Hermit's verify. The rows labelled
# sabre-compat-only, and every row's SaBRe cell (`focused`), belong to the SaBRe
# run type alone; the full validation runs the ptrace cells of the other rows.
# The `variants` entries repeat the strict corpus's rows as strict-<row> tests
# for the strict run type alone, on ptrace with none of the relaxations below,
# and the rr lane's rows as rr-<row> tests whose one cell records and replays
# the program on ptrace, for the rr run type alone.
# The scheduled super suite still runs its four heavy rows (rustc, javac, java,
# node) on ptrace from ci/compat/corpus-strict.json. Lane settings are stated
# once below and every row is expanded into an ordinary test recipe
# (ci/manifest-plan/src/manifest_corpus.rs). The rows were moved verbatim from
# ci/compat/corpus-strict.json, which was extracted mechanically from
# validate.sh's run_compatibility_corpus. In an argv, `{{ROOT_DIR}}` is the
# repository root and `{{VALIDATE_RUN_STATE}}` the validation's per-run state
# directory; compatprep.fixtures fills its strict-compat/real-compat-fixtures.
corpus:
  description: Real program under the portable strict compatibility corpus
  lane: portable
  requires: [linux, x86_64, userns, ptrace]
  backend: ptrace
  verify:
    hermit_args: [--no-virtualize-cpuid, --max-timeslice=disabled]
    hermit_args_reason: >-
      The portable strict corpus measures each program with CPUID
      virtualization and the preemption timeslice off
      (PORTABLE_STRICT_PROBE_ARGS in validate.sh), so it runs on hosts
      without CPUID faulting or a usable PMU
    env: {TMPDIR: /tmp}
    comparator: stripped
    comparator_reason: >-
      The corpus verdict is Hermit's default --verify comparison
      (exit status, streams and stripped logs); it is below L2 and is
      never counted as bitwise parity
    no_retry_reason: >-
      Each program ran once per validation as its own compat.<program> node,
      and a failure of that one run failed the validation; a second attempt
      would let a nondeterministic program pass
    timeout_seconds: 60
    cpu_timeout_seconds: 59
    slow_reason: >-
      The corpus gives each program 60 wall seconds (STRICT_COMPAT_TIMEOUT
      in validate.sh), the wall bound its generated compat.<program>
      validation nodes carried. Their 120 CPU seconds cannot be stated: a
      cell's CPU budget must stay below its wall bound, so it is 59. Measured
      at Hermit 76980bac (validation of 2026-10-01): the slowest of these
      programs used 3.0 s wall and 2.9 s CPU
  diagnostic:
    timeout_seconds: 20
    cpu_timeout_seconds: 19
    slow_reason: >-
      A bounded diagnostic gets a shortened 20-second wall budget
      (PORTABLE_STRICT_DIAGNOSTIC_FAILURES in validate.sh); its CPU budget
      stays one second below it
    rows:
      df: >-
        tracked in https://github.com/rrnewton/hermit/issues/2801: mountinfo
        exposes Hermit's host-TMPDIR backing paths
      ranlib: >-
        tracked in https://github.com/rrnewton/hermit/issues/2897: ranlib's
        temporary-directory getdents64 payload diverges
      top: live process-table reads differ on the GitHub-managed portable runner
      zstd: timed out on the GitHub-managed portable no-PMU runner
      zstd-roundtrip: timed out on the GitHub-managed portable no-PMU runner
  heavy:
    timeout_seconds: 600
    cpu_timeout_seconds: 599
    slow_reason: >-
      A full compile-link-run or JVM startup workload gets the 600-second
      wall budget the scheduled super suite gives each of these rows
      (validate_plan::compat_nodes_for's wall_override); its CPU budget stays
      one second below it
    rows:
      rustc: compiles and runs a Rust program
      javac: compiles a Java program
      java: compiles and runs a Java program
      node: starts the Node.js runtime
  # The SaBRe run type (scripts/validate.rs --sabre-compat-only): every row
  # also runs on SaBRe, except the four the SaBRe corpus never had. Until
  # 2026-10-01 that corpus was ci/compat/corpus-sabre.json, run as 212
  # separate sabrecompat.<program> validation nodes; its rows that agreed
  # with this corpus run these rows' argv here.
  focused:
    - label: sabre-compat-only
      backend: sabre
      except:
        lsof: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no lsof row)
        netlink-route: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no netlink-route row)
        netlink-sock-diag: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no netlink-sock-diag row)
        shell-build: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no shell-build row)
  # Cells measured red on 2026-10-01 (release Hermit at 03bbb8358, through
  # this bucket): each stays enabled with ci: false and its failure class's
  # issue, so the SaBRe run type does not require it.
  unselected:
    - backend: sabre
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/3486
      reason: >-
        The guest starts a second program image, and each image after the
        first makes 33 raw system calls in ld-linux and libc, which
        SaBRe's execution-path contract refuses
        (trusted_shared_object_sites > 0)
      rows:
        [
          addr2line, ar, as, awk, basenc, bc, bzip2, bzip2-roundtrip, "c++filt",
          cargo, chmod, chown, chrt, cmake, cmp, col, colrm, column, comm, cp,
          cpio-roundtrip, cpp, crc32, cscope, csplit, curl-localhost, cut, dc,
          dd, df, diff, diff3, dos2unix, egrep, elfedit, env, envsubst, expand,
          factor, fallocate, fgrep, file, find, flex, flock, fmt, fold, "g++",
          gcc, gcov, getconf, git, gprof, grep, gzip, gzip-roundtrip, hexdump,
          iconv, install, ionice, ip, javac, join, jq, ld, ln, logname, lscpu,
          lua, m4, mkdir, mkfifo, mktemp, mountpoint, msgfmt, msgunfmt, mv,
          namei, nice, nl, nm, nohup, objcopy, objdump, od, paste, patch,
          pathchk, perl, pgrep, pkg-config, pkill, printenv, ptx, ranlib,
          readelf, rev, rm, rmdir, sar-resource-tables, sed, seq, setfacl,
          setfattr, shred, shuf, size, sort, split, sqlite3, ss, stdbuf,
          strings, strip, sync, tac, tar, tar-roundtrip, taskset, tcl, tee,
          time, timeout, top, touch, tr, truncate, tsort, tty, unexpand, uniq,
          uuidgen, wget-localhost, xargs, xmllint, xxd, xz, xz-roundtrip, "yes",
          zip-unzip, zstd, zstd-roundtrip
        ]
    - backend: sabre
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/3489
      reason: >-
        Waiting for a child it just started returns ECHILD under SaBRe
        (make: "wait: No child processes"; clang: "Error waiting for child
        process"; rustc: "could not exec the linker `/usr/bin/clang`: No
        child processes")
      rows:
        [
          clang, make, rustc
        ]
    - backend: sabre
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/3490
      reason: >-
        logger --stderr --no-act exits 1 with no output under SaBRe
      rows:
        [
          logger
        ]
    - backend: sabre
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/3491
      reason: >-
        node prints its output and then dies with SIGSEGV under SaBRe
      rows:
        [
          node
        ]
    - backend: sabre
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/3492
      reason: >-
        The java row's javac step aborts on the in-guest Detcore invariant
        "end_of_timeslice is None during update_logical_time_rcbs"
      rows:
        [
          java
        ]
    - backend: sabre
      result: determinism-failure
      evidence: https://github.com/rrnewton/hermit/issues/3494
      reason: >-
        Diverges at an inbound-signal scheduler commit under SaBRe in 4 of
        4 runs; ptrace passes 3 of 3
      rows:
        [
          iostat, mpstat-softirqs
        ]
    - backend: ptrace
      result: crash-error
      evidence: https://github.com/rrnewton/hermit/issues/2110
      reason: >-
        Detcore panics with "signal_guest: thread should be parked in the
        scheduler" while timeout waits in rt_sigsuspend for its child (1 of
        1 in the validation of 57883eff8); locally 1 of 40 runs diverged at
        the same rt_sigsuspend
      rows:
        [
          timeout
        ]
    - backend: ptrace
      result: determinism-failure
      evidence: https://github.com/rrnewton/hermit/issues/3495
      reason: >-
        Diverges at a read whose content differs between runs (syscall
        134)
      rows:
        [
          java, javac
        ]
  # The strict run type (scripts/validate.rs --strict-compat-only): every row
  # of ci/compat/corpus-strict.json once more on ptrace, under --strict and
  # Hermit's stripped --verify with none of the corpus's relaxations, so
  # CPUID virtualization and the preemption timeslice stay on. Until
  # 2026-10-02 these were 193 separate strictcompat.<program> validation
  # nodes running the same argv.
  variants:
    - label: strict-compat-only
      id_prefix: strict-
      description: Real program under strict Hermit with no relaxations
      timeout_seconds: 60
      cpu_timeout_seconds: 59
      slow_reason: >-
        The strict lane gives every program 60 wall seconds
        (STRICT_COMPAT_TIMEOUT in validate.sh), heavy rows included: the
        wall bound its generated strictcompat.<program> validation nodes
        carried. Their 120 CPU seconds cannot be stated: a cell's CPU
        budget must stay below its wall bound, so it is 59. Measured on
        2026-10-02 with the release Hermit built at 03bbb8358: the slowest
        passing program (rustc) used 4.0 s wall and 3.5 s CPU, and the two
        red JVM rows at most 19.6 s wall and 19.2 s CPU
      no_retry_reason: >-
        Each program ran once per strict validation as its own
        strictcompat.<program> node, and a failure of that one run failed
        the validation; a second attempt would let a nondeterministic
        program pass
      except:
        - reason: >-
            Not in the strict corpus (ci/compat/corpus-strict.json): the
            SaBRe corpus had these programs and the strict corpus did not
          rows:
            [
              timeout, truncate, fallocate, setfattr, setfacl, mountpoint,
              diff3, basenc, dos2unix, envsubst, col, colrm, crc32, uuidgen,
              shred, sync, pathchk, namei, getconf, cscope, flex, msgfmt,
              msgunfmt
            ]
        - reason: >-
            The SaBRe corpus's single-image argv; the strict corpus runs
            these programs through the rows of the same name without the
            suffix
          rows: [lua-direct, perl-direct, df-direct]
      # Measured red on 2026-10-02 with the release Hermit built at
      # 03bbb8358: through this bucket, and 2 of 2 runs each of the retired
      # strictcompat.<program> command.
      unselected:
        - result: determinism-failure
          evidence: https://github.com/rrnewton/hermit/issues/3495
          reason: >-
            Diverges at a read whose content differs between runs (syscall
            134, after the JVM's .hotspotrc lookup)
          rows: [java, javac]
    # The rr run type (scripts/validate.rs --rr-compat-only): every program
    # the rr lane listed as passing record/replay (its 139
    # RR_COMPAT_PASSING_LABELS) recorded and replayed once on ptrace by
    # `hermit record start --verify`. Until 2026-10-02 these were 139
    # separate rrcompat.<program> validation nodes running the argv of
    # ci/compat/corpus-rr.json, whose rows are this corpus's rows of the same
    # labels (the -direct rows for lua, perl and df); that file and the label
    # list went with them.
    - label: rr-compat-only
      id_prefix: rr-
      description: Real program recorded and replayed by Hermit
      mode: replay
      timeout_seconds: 60
      cpu_timeout_seconds: 59
      slow_reason: >-
        The rr lane gave every program 60 wall seconds, the wall bound its
        generated rrcompat.<program> validation nodes carried. Their 120 CPU
        seconds cannot be stated: a cell's CPU budget must stay below its
        wall bound, so it is 59. Measured on 2026-10-02 with the release
        Hermit built from 97ae0ccef: the 51 programs that pass took 56.7
        wall seconds together through the retired command
      except:
        - reason: >-
            Not in the rr lane's corpus (ci/compat/corpus-rr.json until
            2026-10-02), so the rr lane never ran it
          rows:
            [
              xmllint, shell-build, clang, gzip-roundtrip, bzip2-roundtrip,
              xz-roundtrip, zstd-roundtrip, tar-roundtrip, cpio-roundtrip,
              wget-localhost, curl-localhost, ip, ss, netlink-route,
              netlink-sock-diag, lscpu, lsof, time, javac, timeout, truncate,
              fallocate, setfattr, setfacl, mountpoint, diff3, basenc,
              dos2unix, envsubst, col, colrm, crc32, uuidgen, shred, sync,
              pathchk, namei, getconf, cscope, flex, msgfmt, msgunfmt
            ]
        - reason: >-
            The rr corpus ran these programs with the argv of the -direct
            row of the same name, which this run type runs instead
          rows: [lua, perl, df]
        - reason: >-
            In the rr lane's corpus but not in its measured passing set
            (RR_COMPAT_PASSING_LABELS), so the rr lane generated no node for
            it
          rows:
            [
              jq, cargo, curl, cmake, pkg-config, m4, zip-unzip, mktemp,
              iostat, vmstat-disk, pidstat-disk, findmnt, sysctl-random-uuid,
              sar-resource-tables, lsirq, mpstat-softirqs, lsmod, numastat,
              numactl-hardware, ps, vmstat, top, kill, pgrep, pkill, patch,
              chown, ln, csplit, rustc
            ]
        - reason: >-
            Measured to fail record/replay (RR_COMPAT_KNOWN_FAILURES in
            validate.sh): replay of thread 13 diverges near event 132, where
            the header lookup is a readlink in one run and a newfstatat of
            the precompiled .gch in the other
          rows: [g++]
        - reason: >-
            Measured to fail record/replay (RR_COMPAT_KNOWN_FAILURES in
            validate.sh): replay of thread 11 diverges near event 3, in the
            execveat of the rm -rf teardown
          rows: [ar]
        - reason: >-
            Measured to fail record/replay (RR_COMPAT_KNOWN_FAILURES in
            validate.sh): replay diverges at replayer/mod.rs:776 after a
            clean record
          rows: [strip, gprof, gcov]
      # Measured red on 2026-10-02 with the release Hermit built from
      # 97ae0ccef: through this bucket, and through the retired
      # rrcompat.<program> command, where each exits 122 at its first clock
      # read (81 at gettimeofday, 4 at clock_gettime, 3 at time).
      unselected:
        - result: replay-failure
          evidence: https://github.com/rrnewton/hermit/issues/3519
          reason: >-
            Record mode refuses every clock read (gettimeofday,
            clock_gettime, time) as an unsupported syscall, and the recording
            stops with exit status 122
          rows:
            [
              addr2line, as, awk, bash, bc, bzip2, cal, c++filt, chmod, chrt,
              cmp, column, comm, cp, cpp, cut, date, dc, dd, diff, egrep,
              elfedit, env, expand, factor, fgrep, file, find, flock, fmt,
              fold, gcc, git, grep, gzip, hexdump, iconv, install, java, join,
              ld, logger, logname, lua-direct, make, mkdir, mkfifo, mv, nl, nm,
              node, objcopy, objdump, od, paste, perl-direct, ptx, python3,
              ranlib, readelf, rev, rm, rmdir, ruby, sed, seq, shuf, size,
              sort, split, sqlite3, strings, tac, tar, taskset, tcl, tee,
              touch, tr, tsort, tty, unexpand, uniq, xargs, xxd, xz, "yes", zstd
            ]
  rows:
    - {label: "echo", argv: ["/bin/echo", "hermit-compat"]}
    - {label: "true", argv: ["/usr/bin/true"]}
    - {label: "pwd", argv: ["/usr/bin/pwd"]}
    - {label: "seq", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "seq"]}
    - {label: "cat", argv: ["/bin/cat", "{{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures/README.md"]}
    - {label: "wc", argv: ["/usr/bin/wc", "-c", "{{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures/README.md"]}
    - {label: "head", argv: ["/usr/bin/head", "-n", "3", "{{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures/README.md"]}
    - {label: "base64", argv: ["/usr/bin/base64", "{{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures/README.md"]}
    - {label: "base32", argv: ["/usr/bin/base32", "{{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures/README.md"]}
    - {label: "id", argv: ["/usr/bin/id", "-u"]}
    - {label: "lua", argv: ["bash", "-c", "set -euo pipefail; out=$(\"$1\" -e \"$2\"); test \"$out\" = \"$3\"; printf \"lua-fib=%s\\n\" \"$out\"", "bash", "/usr/bin/lua", "local a,b=0,1; for i=1,30 do a,b=b,a+b end; print(a)", "832040"]}
    - {label: "perl", argv: ["bash", "-c", "set -euo pipefail; out=$(\"$1\" -e \"$2\"); test \"$out\" = \"$3\"; printf \"perl-prime-sum=%s\\n\" \"$out\"", "bash", "/usr/bin/perl", "my $sum=0; OUTER: for my $n (2..100) { for my $d (2..int(sqrt($n))) { next OUTER if $n % $d == 0 } $sum += $n } print \"$sum\\n\"", "1060"]}
    - {label: "bc", argv: ["bash", "-c", "set -euo pipefail; out=$(printf \"%s\\n\" \"$2\" | BC_LINE_LENGTH=200 \"$1\" -q); test \"$out\" = \"$3\"; printf \"bc-math=%s\\n\" \"$out\"", "bash", "/usr/bin/bc", "define f(n) { auto r,i; r=1; for(i=2;i<=n;i++) r*=i; return(r) }; scale=50; print f(20), \" \", sqrt(2), \"\\n\"", "2432902008176640000 1.41421356237309504880168872420969807856967187537694"]}
    - {label: "tcl", argv: ["bash", "-c", "set -euo pipefail; out=$(printf \"%s\\n\" \"$2\" | \"$1\"); test \"$out\" = \"$3\"; printf \"tcl-squares=%s\\n\" \"$out\"", "bash", "/usr/bin/tclsh", "set sum 0; for {set i 1} {$i <= 100} {incr i} {set sum [expr {$sum + $i*$i}]}; puts $sum", "338350"]}
    - {label: "dc", argv: ["bash", "-c", "set -euo pipefail; out=$(printf \"%s\\n\" \"$2\" | \"$1\"); test \"$out\" = \"$3\"; printf \"dc-math=%s\\n\" \"$out\"", "bash", "/usr/bin/dc", "2 100 ^ 1 - n [ ]P 4 13 497 | p", "1267650600228229401496703205375 445"]}
    - {label: "awk", argv: ["bash", "-c", "set -euo pipefail; printf \"alpha 2\\nbeta 3\\nalpha 5\\n\" | awk \"\\$1 == \\\"alpha\\\" { sum += \\$2 } END { print sum }\" | diff -u <(printf \"7\\n\") -; printf \"awk-ok\\n\""]}
    - {label: "sqlite3", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "sqlite3"]}
    - {label: "jq", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "jq"]}
    - {label: "xmllint", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "xmllint"]}
    - {label: "bash", argv: ["bash", "-c", "for i in 1 2 3; do echo \"$i\"; done"]}
    - {label: "shell-build", argv: ["bash", "{{ROOT_DIR}}/tests/compat/complex_shell_workload.sh", "{{VALIDATE_RUN_STATE}}/strict-compat/shell-build"]}
    - {label: "cargo", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "cargo"]}
    - {label: "clang", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "clang"]}
    - {label: "ruby", argv: ["/usr/bin/ruby", "--disable-gems", "-e", "values = (1..5).map { |value| value * value }; raise \"unexpected squares\" unless values == [1, 4, 9, 16, 25]; puts values.join(\",\")"]}
    - {label: "python3", argv: ["/usr/bin/python3", "-c", "print(42)"]}
    - {label: "curl", argv: ["/usr/bin/curl", "--fail", "--silent", "--show-error", "file:///etc/hostname"]}
    - {label: "git", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "git"]}
    - {label: "cmake", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "cmake"]}
    - {label: "pkg-config", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "pkg-config"]}
    - {label: "m4", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "m4"]}
    - {label: "gcc", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "gcc"]}
    - {label: "g++", id: "gxx", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "g++"]}
    - {label: "make", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "make"]}
    - {label: "ar", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "ar"]}
    - {label: "as", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "as"]}
    - {label: "ld", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "ld"]}
    - {label: "nm", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "nm"]}
    - {label: "objcopy", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "objcopy"]}
    - {label: "objdump", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "objdump"]}
    - {label: "ranlib", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "ranlib"]}
    - {label: "readelf", argv: ["env", "REAL_COMPAT_FIXTURES={{VALIDATE_RUN_STATE}}/strict-compat/real-compat-fixtures", "bash", "{{ROOT_DIR}}/tests/compat/real_compat_workload.sh", "readelf"]}
