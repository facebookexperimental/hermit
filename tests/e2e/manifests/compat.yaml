schema: 3
bucket: compat
# The portable strict compatibility corpus: real programs installed on the
# validation host, each run under Hermit's verify. The verify cells of the rows
# labelled sabre-compat-only, and every row's SaBRe cell (`focused`), belong to
# the SaBRe run type alone; the full validation runs the ptrace verify cells of
# the other rows (since 2026-10-13 only rustc, javac, java, node and timeout
# carry that label: https://github.com/rrnewton/hermit/issues/4269 moved 25
# rows into the full run, so that parity compares them), and the liteinst and in-guest-trap verify cells of the rows
# each `additional` entry names. The rr lane's rows also have a replay cell
# (`replay`) that records and replays the program on ptrace, for the rr run
# type alone. Each row is one test: its ptrace verify cell runs at the
# host's strictness level (tests/e2e/manifests/README.md, "Strictness level"),
# strict with CPUID virtualization and the preemption timer on where the host
# has CPUID faulting and an exact branch counter, relaxed elsewhere. Until
# 2026-10-13 the `variants` entry repeated every row as a second test,
# compat/strict-<row>, for a strict run type, while this cell always ran
# relaxed (https://github.com/rrnewton/hermit/issues/4276).
# The scheduled super suite runs the four heavy rows' ptrace cells (rustc,
# javac, java, node: the `heavy` section's `labels`) through
# supercompat.manifest_compat, against the super run type's release Hermit. Lane settings are stated once below and every
# row is expanded into an ordinary test recipe
# (ci/manifest-plan/src/manifest_corpus.rs). The rows were moved verbatim from
# ci/compat/corpus-strict.json (deleted 2026-10-13), which was extracted
# mechanically from validate.sh's run_compatibility_corpus. In an argv,
# `{{ROOT_DIR}}` is the repository root and `{{VALIDATE_RUN_STATE}}` the
# validation's per-run state directory; compatprep.fixtures fills its
# strict-compat/real-compat-fixtures.
# `{{XDG_CONFIG_HOME}}` is the cell-owned configuration copy, equalized to
# /tmp/e2e/xdg-config for verify and kept at its own host path for replay.
corpus:
  description: Real program under the portable strict compatibility corpus
  lane: portable
  requires: [linux, x86_64, userns, ptrace]
  backend: ptrace
  verify:
    env: {TMPDIR: /tmp}
    no_retry_reason: >-
      Each program ran once per validation as its own compat.<program> node,
      and a failure of that one run failed the validation; a second attempt
      would let a nondeterministic program pass
    timeout_seconds: 60
    cpu_timeout_seconds: 59
    slow_reason: >-
      The corpus gives each program 60 wall seconds (STRICT_COMPAT_TIMEOUT
      in validate.sh), the wall bound its generated compat.<program>
      validation nodes carried. Their 120 CPU seconds cannot be stated: a
      cell's CPU budget must stay below its wall bound, so it is 59. Measured
      at Hermit 76980bac (validation of 2026-10-01): the slowest of these
      programs used 3.0 s wall and 2.9 s CPU
  heavy:
    timeout_seconds: 600
    cpu_timeout_seconds: 599
    slow_reason: >-
      A full compile-link-run or JVM startup workload gets the 600-second
      wall budget the scheduled super suite gave each of these rows; its CPU
      budget stays one second below it
    # The super run type (scripts/validate.rs super) runs these rows' ptrace
    # cells through supercompat.manifest_compat. Until 2026-10-13 it ran them
    # as generated compat.<row> nodes from ci/compat/corpus-strict.json, with
    # the corpus's two relaxations and Hermit's stripped comparison; now they
    # run at the host's strictness level under --verify-strict, like every
    # other compat cell (https://github.com/rrnewton/hermit/issues/4276).
    labels: [super]
    rows:
      rustc: compiles and runs a Rust program
      javac: compiles a Java program
      java: compiles and runs a Java program
      node: starts the Node.js runtime
  # The SaBRe run type (scripts/validate.rs --sabre-compat-only): every row
  # also runs on SaBRe, except the four the SaBRe corpus never had. Until
  # 2026-10-01 that corpus was ci/compat/corpus-sabre.json, run as 212
  # separate sabrecompat.<program> validation nodes; its rows that agreed
  # with this corpus run these rows' argv here.
  focused:
    - label: sabre-compat-only
      backend: sabre
      except:
        lsof: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no lsof row)
        netlink-route: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no netlink-route row)
        netlink-sock-diag: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no netlink-sock-diag row)
        shell-build: >-
          Not in the SaBRe corpus this replaced (ci/compat/corpus-sabre.json
          had no shell-build row)
  # In-guest LiteInst (https://github.com/rrnewton/hermit/issues/3745, step 1
  # of https://github.com/rrnewton/hermit/issues/3520): the full validation
  # runs a verify cell on liteinst and on in-guest-trap for each row that
  # passed 10 of 10 verify runs on that backend in a local survey of
  # 2026-10-08 (the manifest harness, the maximum timeslice forced off): 43
  # rows in the first survey (release Hermit 84d5db7e), and 20 more in the
  # second (release Hermit 81f3e50d, with the in-guest heap-layout fix and the
  # compat fixtures prepared, which the first survey had not done). Unlike the
  # lane's cell, each has the global default budget and none of the row's
  # run-type labels, so the full validation runs it on the three
  # sabre-compat-only rows (df-direct, lua-direct and perl-direct) too. Each
  # row left off names the failure class of its first run in the second
  # survey; the 27 sabre-compat-only rows that survey did not run keep the
  # first survey's result. python3 stays off by coordinator ruling (its
  # `disabled` entries say why).
  additional:
    - backend: liteinst
      hermit_args: [--max-timeslice=disabled]
      hermit_args_reason: >-
        In-guest LiteInst (liteinst and in-guest-trap) refuses a preemption
        timer, so these cells run with the maximum timeslice disabled. The
        previously selected cells passed 10 of 10 verify runs that way on
        2026-10-08 (https://github.com/rrnewton/hermit/issues/3745). The
        mpstat-softirqs and pidstat-disk cells additionally select the existing
        in-guest SIGALRM handler path with site patching off through row_env
        below (https://github.com/rrnewton/hermit/issues/3520)
      rows:
        [
          arch, b2sum, base32, base64, basename, bash, bracket, cal, cat, cksum,
          curl, date, df-direct, dirname, du, echo, expr, findmnt, free, getopt,
          groups, head, hostname, id, kill, logname, ls, lsirq, lsmod,
          lua-direct, md5sum, mpstat-softirqs, nproc, numactl-hardware, numastat, numfmt,
          openssl, perl-direct, pidstat-disk, pinky, pr, printf, ps, pwd, readlink, realpath,
          sha1sum, sha224sum, sha256sum, sha384sum, sha512sum, sleep, stat, sum,
          sysctl-random-uuid, test, "true", uname, uptime, users, vmstat,
          vmstat-disk, wc, wc-lines, whoami
        ]
      # These settings belong to exactly these two LiteInst cells. Other rows
      # and backends retain their existing environments and interception
      # routes.
      row_env:
        mpstat-softirqs:
          REVERIE_LITEINST_SITE_PATCHING: '0'
          REVERIE_LITEINST_SIGALRM_HANDLERS: '1'
        pidstat-disk:
          REVERIE_LITEINST_SITE_PATCHING: '0'
          REVERIE_LITEINST_SIGALRM_HANDLERS: '1'
      disabled_reason: >-
        Did not pass 10 of 10 verify runs on liteinst with the maximum
        timeslice disabled in the first local survey of 2026-10-08, which ran
        without the compat fixtures; the second survey did not run this
        sabre-compat-only row (https://github.com/rrnewton/hermit/issues/3745)
      disabled:
        seq: >-
          Its first verify run on liteinst failed in the second local survey
          of 2026-10-08 (release Hermit 81f3e50d, compat fixtures prepared):
          execve of a further program image returned EOPNOTSUPP (exec refused)
          (https://github.com/rrnewton/hermit/issues/3745)
        lua: >-
          Its first verify run on liteinst failed in the second local survey
          of 2026-10-08 (release Hermit 81f3e50d, compat fixtures prepared):
          execve of a further program image returned EOPNOTSUPP (exec refused)
          (https://github.com/rrnewton/hermit/issues/3745)
