  # The rr run type (scripts/validate.rs --rr-compat-only): every program
  # the rr lane listed as passing record/replay (its 139
  # RR_COMPAT_PASSING_LABELS) recorded and replayed once on ptrace by
  # `hermit record start --verify`, as the replay cell of the row's own
  # test. Until 2026-10-02 these were 139 separate rrcompat.<program>
  # validation nodes running the argv of ci/compat/corpus-rr.json, whose rows
  # are this corpus's rows of the same labels (the -direct rows for lua, perl
  # and df); that file and the label list went with them. Until 2026-10-04
  # each was a separate compat/rr-<row> test. Since 2026-10-09 it also covers
  # every other row except the -direct twins below: of the 77 rows the rr
  # lane never listed as passing, 73 replayed at canonical bitwise parity in
  # three survey runs and joined, and 4 stay unselected under their issues.
  # Like the rr lane's command, the replay cell runs without the verify
  # settings above: no Hermit flags, comparator or TMPDIR, and one attempt.
  replay:
    label: rr-compat-only
    timeout_seconds: 60
    cpu_timeout_seconds: 59
    slow_reason: >-
      The rr lane gave every program 60 wall seconds, the wall bound its
      generated rrcompat.<program> validation nodes carried. Their 120 CPU
      seconds cannot be stated: a cell's CPU budget must stay below its
      wall bound, so it is 59. Measured on 2026-10-02 with the release
      Hermit built from 97ae0ccef: the 51 programs that pass took 56.7
      wall seconds together through the retired command
    except:
      - reason: >-
          The rr corpus ran these programs with the argv of the -direct
          row of the same name, which this run type runs instead
        rows: [lua, perl, df]
      - reason: >-
          Its own check fails when a receive path delivers NETLINK_SOCK_DIAG
          socket inodes unzeroed, which is Detcore's run-mode metadata
          sanitizer. Record and replay disable metadata virtualization by
          design, so the guest sees the real inodes there, as Linux returns
          them (https://github.com/rrnewton/hermit/issues/3965); its replay
          matches its recording bitwise
        rows: [netlink-sock-diag]
    # Measured on 2026-10-09 by three --rr-compat-only runs of a survey
    # commit that gave the 77 rows excluded above replay cells: 73 recorded and
    # replayed at canonical bitwise parity in 3 of 3 runs and joined the run
    # type; these did not. (netlink-sock-diag, the fourth, is excepted above:
    # its check asserts a run-mode property. flex and timeout, the fifth and
    # sixth, joined once https://github.com/rrnewton/hermit/issues/3964 and
    # https://github.com/rrnewton/hermit/issues/3963 were fixed.)
    unselected:
      - result: replay-failure
        evidence: https://github.com/rrnewton/hermit/issues/3966
        reason: >-
          Replay reads a different 11-byte readlink target than the recording
          at scheduler turn 112, in 3 of 3 runs
        rows: [lsof]
