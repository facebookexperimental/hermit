# Generated migration inventory for C guests. See README.md for schema v2.

schema = 2
bucket = "determinism-stress-c"

[[test]]
id = "determinism-stress-c/fork-tree"
description = "Strict verification for tests/e2e/determinism-stress/fork_tree.c"
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 90
occasional = false
program = "tests/e2e/determinism-stress/fork_tree.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.verify]
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Initial C-corpus migration preserves the established ptrace baseline; qualify DBI separately"
kvm = "Initial C-corpus migration preserves the established ptrace baseline; qualify KVM separately"
sabre = "Initial C-corpus migration preserves the established ptrace baseline; qualify SaBRe separately"
liteinst = "Initial C-corpus migration preserves the established ptrace baseline; qualify LiteInst separately"

[test.disabled_modes]
naked = "This migration inventories strict verification; it does not assert native nondeterminism"
replay = "Record/replay qualification is separate from the initial strict-verification migration"
chaos = "Chaos scheduling is only meaningful for guests with an explicit schedule-diversity oracle"

