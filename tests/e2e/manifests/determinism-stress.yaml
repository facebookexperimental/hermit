schema: 3
bucket: determinism-stress
test:
  - id: determinism-stress/thread-output
    description: Concurrent shell writers produce repeatable output under strict verification
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
    occasional: false
    program: tests/e2e/determinism-stress/thread-output.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Native ordering can vary but is not guaranteed to diverge in a bounded run
      verify:
        ci:
          ptrace: true
          kvm: true
        backends_enabled:
          - ptrace
          - kvm
        backends_disabled:
          dbt: DBT coverage is owned by its backend parity partition
          sabre: SaBRe requires its external runtime
          liteinst: LiteInst coverage is owned by its backend compatibility partition
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns the required relation for this example
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The order-violation test has the stronger seeded oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
  - id: determinism-stress/example-race
    description: The user-facing concurrent shell race repeats under every applicable backend
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - bash
    occasional: false
    direct: ./examples/race.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: Native ordering is not guaranteed to vary in a bounded run
      verify:
        ci:
          ptrace: true
          kvm: true
          sabre: false
        backends_enabled:
          - ptrace
          - kvm
          - sabre
        backends_disabled:
          dbt: Concurrent shell stdout differed between strict verification runs
          liteinst: The preload runtime cannot survive the shell script's post-start exec
        ci_disabled_reason:
          sabre: {"evidence": "TaskGraph list-the-never-measured-red-cells-by-test-id-mode-backend; Hermit 5b811757980b9cab599206c047560a7962176a6b; repeated canonical verification summary sha256 944bf8af55c1102757a068818e840ee7f8e083f9855f9e302b1eddfd363e4cb4", "reason": "Repeated canonical verification retained a crash error; this cell did not pass every repetition cleanly. Retained detail: SaBRe execution path is incomplete or used fallback/native sites", "result": "crash-error"}
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification owns the examples-directory parity contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Strict verification already checks deterministic scheduling for this example
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
  - id: determinism-stress/thread-contention
    description: Mutex contention, poll/epoll, signals, and shared mmap across fork repeat under strict verification
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/e2e/determinism-stress/thread-contention.sh
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      naked:
        ci: false
        runs: 5
        assert:
          min_distinct: 2
        backends_enabled:
          - native
        backends_disabled: {}
        ci_disabled_reason: This native control is not selected by ordinary validation; add it to ci/expected-e2e-plan.json only after repeated runs satisfy its declared outcome oracle.
      verify:
        ci: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: DBT coverage is owned by its backend parity partition
          kvm: KVM requires the privileged runner
          sabre: SaBRe requires its external runtime
          liteinst: LiteInst coverage is owned by its backend compatibility partition
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The focused C replay sentinel owns the blocking replay contract
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: The order-violation test has the seeded schedule-diversity oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No edge-case Hermit arguments are required
          dbt: No edge-case Hermit arguments are required
          kvm: No edge-case Hermit arguments are required
          sabre: No edge-case Hermit arguments are required
          liteinst: No edge-case Hermit arguments are required
