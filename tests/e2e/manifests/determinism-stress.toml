[[test]]
id = "determinism-stress/order-violation"
description = "Different chaos seeds expose distinct reproducible thread schedules"
lane = "portable"
requires = ["linux","x86_64","userns","ptrace","cc"]
timeout_seconds = 90
occasional = false
program = "tests/chaos/order_violation.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.build]
cflags = ["-pthread", "-Wno-unused-parameter"]

[test.modes.naked]
ci = false
backends_enabled = []
[test.modes.naked.backends_disabled]
native = "Native scheduling does not guarantee both outcomes within a fixed budget"

[test.modes.verify]
ci = true
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "DBI coverage is owned by its backend parity partition"
kvm = "KVM requires the privileged runner"
sabre = "SaBRe requires its external runtime"
liteinst = "LiteInst coverage is owned by its backend compatibility partition"

[test.modes.replay]
ci = false
backends_enabled = []
[test.modes.replay.backends_disabled]
ptrace = "Chaos witness reproduction is the required relation for this deliberately racy guest"
dbi = "Record/replay is unsupported by DBI"
kvm = "Record/replay is unsupported by KVM"
sabre = "Record/replay is unsupported by SaBRe"
liteinst = "Record/replay is unsupported by LiteInst"

[test.modes.chaos]
ci = true
seeds = [0,9]
assert = { min_distinct = 2, min_passes = 1, min_failures = 1 }
backends_enabled = ["ptrace"]
[test.modes.chaos.backends_disabled]
dbi = "Chaos scheduling is unsupported by DBI"
kvm = "Chaos scheduling is unsupported by KVM"
sabre = "Chaos scheduling is unsupported by SaBRe"
liteinst = "Chaos scheduling is unsupported by LiteInst"

[test.modes.custom]
ci = false
backends_enabled = []
[test.modes.custom.backends_disabled]
ptrace = "Chaos mode already supplies the required scheduler arguments"
dbi = "No edge-case Hermit arguments are required"
kvm = "No edge-case Hermit arguments are required"
sabre = "No edge-case Hermit arguments are required"
