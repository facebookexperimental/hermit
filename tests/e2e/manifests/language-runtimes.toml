schema = 2
bucket = "language-runtimes"

[[test]]
id = "language-runtimes/bash-loop-pipe-time"
description = "Bash file I/O, loops, pipelines, hashing, and time repeat under Hermit"
lane = "portable"
requires = ["linux","x86_64","userns","ptrace","bash"]
timeout_seconds = 90
occasional = false
program = "tests/e2e/language-runtimes/bash-loop-pipe-time.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.naked]
ci = false
backends_enabled = []
[test.modes.naked.backends_disabled]
native = "This regression establishes Hermit verification, not native nondeterminism"

[test.modes.verify]
ci = true
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "DBI Bash qualification is tracked by backend compatibility"
kvm = "KVM interpreter coverage requires separate privileged qualification"
sabre = "SaBRe requires its external runtime"
liteinst = "LiteInst Bash qualification is tracked by backend compatibility"

[test.modes.replay]
ci = false
backends_enabled = []
[test.modes.replay.backends_disabled]
ptrace = "The focused C sentinel owns the blocking replay contract"
dbi = "Record/replay is unsupported by DBI"
kvm = "Record/replay is unsupported by KVM"
sabre = "Record/replay is unsupported by SaBRe"
liteinst = "Record/replay is unsupported by LiteInst"

[test.modes.chaos]
ci = false
backends_enabled = []
[test.modes.chaos.backends_disabled]
ptrace = "The Bash workload has no schedule-diversity oracle"
dbi = "Chaos scheduling is unsupported by DBI"
kvm = "Chaos scheduling is unsupported by KVM"
sabre = "Chaos scheduling is unsupported by SaBRe"
liteinst = "Chaos scheduling is unsupported by LiteInst"

[test.modes.custom]
ci = false
backends_enabled = []
[test.modes.custom.backends_disabled]
ptrace = "No edge-case Hermit arguments are required"
dbi = "No edge-case Hermit arguments are required"
kvm = "No edge-case Hermit arguments are required"
sabre = "No edge-case Hermit arguments are required"
liteinst = "No edge-case Hermit arguments are required"

