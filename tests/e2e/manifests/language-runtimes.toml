# Power/weight 2026-08-06 @ Hermit 96d18cbad, ptrace verify, debug build,
# devbig014 (portable profile: --log=info --strict --verify,
# no-virtualize-cpuid, max-timeslice=disabled):
# 9231 ms = 16% of the 56.2s ptrace cell corpus -- the SINGLE most expensive
# cell. VERDICT: KEEP AS IS, do NOT pin the interpreter.
# The cost is NOT this test's logic. `python3` resolves through PATH to
# /usr/local/fbcode/platform010/bin/fbpython, not /usr/bin/python3.9 (native
# startup 99ms vs 18ms). Measured syscall surface of the two interpreters on
# an identical trivial program: fbpython 70 syscall types / 19742 calls vs
# system python3 32 types / 1586 calls. fbpython UNIQUELY reaches 40 types
# including the socket family (socket/bind/connect/send*/recv*/getsockopt),
# epoll (create/create1/ctl/wait), eventfd2, clone3, timer_create/settime,
# poll, pipe2, madvise/process_madvise, membarrier and sched_yield.
# So the 10x cost buys 12.4x syscall volume and 2.2x syscall types: high
# power-to-weight, not low. Pinning /usr/bin/python3 would be a ~10x speedup
# that SILENTLY DROPS 40 syscall types -- rejected by the shrink acceptance
# gate, and the inverse of the `java -version` trap.
# CAVEAT worth fixing separately: that surface is ACCIDENTAL, UNDECLARED and
# HOST-DEPENDENT. `requires` says only "python3"; on a host without fbpython
# on PATH this cell silently becomes ~10x cheaper and loses the socket/epoll
# surface with no signal. Make the interpreter explicit rather than leaving
# it to PATH. See the sibling python-hash-determinism, which pins
# /usr/bin/python3 and therefore runs 908 ms with the SMALL surface -- the
# corpus currently has an undeclared, PATH-determined surface split.
[[test]]
id = "language-runtimes/python-io-subprocess-time"
description = "Python file I/O, subprocess capture, hashing, and time repeat under Hermit"
lane = "portable"
requires = ["linux","x86_64","userns","ptrace","python3"]
timeout_seconds = 90
occasional = false
program = "tests/e2e/language-runtimes/python-io-subprocess-time.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.naked]
