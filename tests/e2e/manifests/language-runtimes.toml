# Power/weight 2026-08-06 @ Hermit 96d18cbad, ptrace verify, debug build:
# 8818 ms = 16% of the 56.2s ptrace cell corpus (rank 3 of 60).
# VERDICT: KEEP the cell, but this is the corpus's clearest power/weight
# ANOMALY and it is worth an owner decision.
# Its guest is a ONE-LINER (a 7-element set, one hash(), and
# sum(i*i for i in range(1,101))) yet it costs 8818 ms, while the sibling
# python-hash-determinism runs an equally trivial program in 908 ms -- 9.7x
# cheaper. The ONLY material difference is the interpreter: this cell execs
# `python3` (PATH -> fbpython), the sibling execs `/usr/bin/python3`.
# So ~all of this cell's 8818 ms is interpreter startup, not test content.
# Do NOT simply pin the path: measured, fbpython reaches 40 syscall types
# the system interpreter never does (sockets, epoll, eventfd2, clone3,
# timers). Pinning is a 9.7x speedup that drops real surface.
# The two interpreters also produce DIFFERENT observables for this exact
# program (set order and hash() differ even at PYTHONHASHSEED=0). The cell
# still passes because --verify self-compares two runs of the SAME
# interpreter, but its observable is host-determined. Decide explicitly
# which interpreter this contract is about and declare it.
[[test]]
id = "language-runtimes/python-hashseed"
description = "Python string hash and set iteration order vary natively and repeat under Hermit"
lane = "portable"
requires = ["linux","x86_64","userns","ptrace","python3"]
timeout_seconds = 90
occasional = false
program = "tests/e2e/language-runtimes/python-hashseed.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.naked]
ci = false
runs = 3
assert = { min_distinct = 2 }
backends_enabled = ["native"]
[test.modes.naked.backends_disabled]

[test.modes.verify]
ci = true
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbt = "DBT Python support is tracked by backend compatibility"
kvm = "KVM Python coverage is in the privileged applications bucket"
sabre = "SaBRe requires its external runtime"
liteinst = "LiteInst Python support is tracked by backend compatibility"

