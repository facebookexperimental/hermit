schema = 2
bucket = "system-utils"

[[test]]
id = "system-utils/date-nanoseconds"
description = "A valid wall-clock timestamp varies natively and repeats under Hermit"
lane = "portable"
requires = ["linux","x86_64","userns","ptrace"]
timeout_seconds = 60
occasional = false
program = "tests/e2e/system-utils/date-nanoseconds.sh"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.modes.naked]
ci = false
runs = 3
assert = { min_distinct = 2 }
backends_enabled = ["native"]
[test.modes.naked.backends_disabled]

[test.modes.verify]
ci = true
backends_enabled = ["ptrace", "sabre"]
[test.modes.verify.backends_disabled]
dbi = "DBI coverage is owned by its backend parity partition"
kvm = "KVM requires the privileged runner"
liteinst = "LiteInst coverage is owned by its backend compatibility partition"

[test.modes.replay]
ci = false
backends_enabled = []
[test.modes.replay.backends_disabled]
ptrace = "The date utility currently diverges while replaying timezone-file reads"
dbi = "Record/replay is unsupported by DBI"
kvm = "Record/replay is unsupported by KVM"
sabre = "Record/replay is unsupported by SaBRe"
liteinst = "Record/replay is unsupported by LiteInst"

[test.modes.chaos]
ci = false
backends_enabled = []
[test.modes.chaos.backends_disabled]
ptrace = "A single-threaded wall-clock probe has no scheduling oracle"
dbi = "Chaos scheduling is unsupported by DBI"
kvm = "Chaos scheduling is unsupported by KVM"
sabre = "Chaos scheduling is unsupported by SaBRe"
liteinst = "Chaos scheduling is unsupported by LiteInst"

[test.modes.custom]
ci = false
backends_enabled = []
[test.modes.custom.backends_disabled]
ptrace = "No edge-case Hermit arguments are required"
dbi = "No edge-case Hermit arguments are required"
kvm = "No edge-case Hermit arguments are required"
sabre = "No edge-case Hermit arguments are required"
liteinst = "No edge-case Hermit arguments are required"

[[test]]
id = "system-utils/clock-determinism"
description = "clock_gettime/gettimeofday output is identical across repeated Hermit runs"
lane = "portable"
requires = ["linux", "x86_64", "userns", "ptrace", "cc"]
timeout_seconds = 90
occasional = false
program = "tests/c/clock_determinism.c"
observation = { status = true, stdout = true, stderr = false, artifacts = [] }

[test.build]
cflags = ["-O0", "-D_GNU_SOURCE"]

[test.modes.naked]
ci = false
backends_enabled = []
[test.modes.naked.backends_disabled]
native = "The date-nanoseconds entry owns the native clock nondeterminism control"

[test.modes.verify]
ci = true
backends_enabled = ["ptrace"]
[test.modes.verify.backends_disabled]
dbi = "Enable after the ptrace baseline for direct C guests is trusted"
kvm = "Enable after the ptrace baseline for direct C guests is trusted"
sabre = "SaBRe does not intercept RDTSCP; clock probes can leak raw host TSC"
liteinst = "LiteInst interception is incomplete and nondeterministic under verification"

[test.modes.replay]
ci = false
backends_enabled = []
[test.modes.replay.backends_disabled]
ptrace = "Clock replay divergence is tracked separately from this determinism entry"
dbi = "Record/replay is unsupported by DBI"
kvm = "Record/replay is unsupported by KVM"
sabre = "Record/replay is unsupported by SaBRe"
liteinst = "Record/replay is unsupported by LiteInst"

[test.modes.chaos]
ci = false
backends_enabled = []
[test.modes.chaos.backends_disabled]
ptrace = "The clock matrix guest is single-threaded"
dbi = "Chaos scheduling is unsupported by DBI"
kvm = "Chaos scheduling is unsupported by KVM"
sabre = "Chaos scheduling is unsupported by SaBRe"
liteinst = "Chaos scheduling is unsupported by LiteInst"

[test.modes.custom]
ci = true
args = ["--base-env=minimal", "--no-virtualize-cpuid", "--max-timeslice=disabled"]
assert = { runs = 5, repeat_identical = true }
backends_enabled = ["ptrace"]
[test.modes.custom.backends_disabled]
dbi = "The custom clock matrix baseline is ptrace-only"
kvm = "The custom clock matrix baseline is ptrace-only"
sabre = "The custom clock matrix baseline is ptrace-only"
liteinst = "The custom clock matrix baseline is ptrace-only"
