      - ptrace
      - cc
    occasional: false
    program: tests/c/session_identity.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      # PINS CURRENT BEHAVIOUR; it does not assert the behaviour is correct.
      # Detcore handles the WRITE side (handle_setsid / handle_setpgid) but has
      # no handler for getsid/getpgid/getpgrp, which pass through to the kernel.
      # classify_syscall says so: all three sit in its PASS-THRU arm, described
      # as "conditionally repeatable under Hermit's fixed-container,
      # stable-filesystem, and serialization assumptions".
      # ⚠️ THIS CELL IS THE TEST FOR THAT STATED CONDITION — the stability it
      # observes comes from the PID and user NAMESPACE, and nothing else checks
      # that the fixed-container assumption still holds. It is NOT evidence
      # that the read side is determinized. See the guest source.
      # There is an open question on whether Hermit should model process
      # groups and sessions at all; if that is answered by building a model,
      # these values are expected to change and this cell to be updated.
