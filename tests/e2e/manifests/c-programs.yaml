        # THRESHOLD PROVENANCE. min_distinct is empirical, not a round number,
        # and it must be re-measured whenever the guest or the scheduler
        # changes rather than carried forward on trust. A retained-work change
        # from 256 sched_yield points to four kept the OpenMP reduction and the
        # output calculation but narrowed seeds 0..31 to 6/8 classes.
        # min_distinct=7 accepts the measured healthy window and refuses that
        # partial narrowing. All selected outcomes must exit successfully.
