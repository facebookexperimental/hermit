          ptrace: Across 59 retained typed passing rows, nearest-rank p90 was 34.964 wall seconds and 30.251855 CPU seconds; 4x wall exceeds 120, so ceil(3x wall)=105 and ceil(1.5x CPU)=46.
        # The chaos argument preserves the default full floating-point result
        # used by strict verification, but prints only its low three bits here.
        # That gives an exact eight-class ceiling: the output can express at
