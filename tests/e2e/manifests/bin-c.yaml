    description: Strict verification for tests/bin/robust_futex_test.c
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/bin/robust_futex_test.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      verify:
        ci:
          ptrace: true
        backends_enabled:
          - ptrace
        backends_disabled:
          dbt: Initial C-corpus migration preserves the established ptrace baseline; qualify DBT separately
          kvm: Initial C-corpus migration preserves the established ptrace baseline; qualify KVM separately
          sabre: Robust-futex owner-death wakeup exercises core Detcore scheduling and currently times out under SaBRe; owner review is required
          liteinst: The LiteInst host-hybrid backend refuses clone3 with ENOTSUPP before the guest creates its first thread, so this multi-threaded guest cannot run there yet; unrelated to robust-futex owner death
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
      naked:
