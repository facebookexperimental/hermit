schema: 3
bucket: bin-c
test:
  - id: bin-c/posix-timer-test
    description: Strict verification for tests/bin/posix_timer_test.c
    lane: portable
    requires:
      - linux
      - x86_64
      - userns
      - ptrace
      - cc
    occasional: false
    program: tests/bin/posix_timer_test.c
    observation:
      status: true
      stdout: true
      stderr: false
      artifacts: []
    modes:
      verify:
        ci: true
        backends_enabled:
          - ptrace
          - sabre
          - dbt
          - kvm
        backends_disabled:
          liteinst: Owner reset 2026-10-04 - the ptrace-owned LiteInst hybrid is being replaced by in-guest Detcore, and LiteInst cells return only on the new architecture (https://github.com/rrnewton/hermit/issues/3745, step 1 of https://github.com/rrnewton/hermit/issues/3520)
          in-guest-trap: Owner directive 2026-10-02 - in-guest-trap (in-guest LiteInst with syscall site patching off) is scored as its own column, apart from liteinst, and its verify cells return only through their own track, as liteinst's do after the 2026-10-04 reset (step C4 of https://github.com/rrnewton/hermit/issues/3520)
      naked:
        ci: false
        backends_enabled: []
        backends_disabled:
          native: This migration inventories strict verification; it does not assert native nondeterminism
      replay:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Record/replay qualification is separate from the initial strict-verification migration
          dbt: Record/replay is unsupported by DBT
          kvm: Record/replay is unsupported by KVM
          sabre: Record/replay is unsupported by SaBRe
          liteinst: Record/replay is unsupported by LiteInst
          in-guest-trap: Record/replay is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      chaos:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: Chaos scheduling is only meaningful for guests with an explicit schedule-diversity oracle
          dbt: Chaos scheduling is unsupported by DBT
          kvm: Chaos scheduling is unsupported by KVM
          sabre: Chaos scheduling is unsupported by SaBRe
          liteinst: Chaos scheduling is unsupported by LiteInst
          in-guest-trap: Chaos scheduling is unsupported by in-guest LiteInst, which in-guest-trap runs with syscall site patching off
      custom:
        ci: false
        backends_enabled: []
        backends_disabled:
          ptrace: No custom edge-case arguments have been calibrated for this C guest
          dbt: No custom edge-case arguments have been calibrated for this C guest
          kvm: No custom edge-case arguments have been calibrated for this C guest
          sabre: No custom edge-case arguments have been calibrated for this C guest
          liteinst: No custom edge-case arguments have been calibrated for this C guest
          in-guest-trap: No custom edge-case arguments have been calibrated for in-guest-trap
