[package]
name = "detcore-liteinst"
version = "0.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"

# This crate is a preload runtime, not a testable library. Its `.init_array`
# constructor (src/lib.rs) runs before any Rust test harness and `_exit(127)`s
# when `REVERIE_LITEINST_COORDINATOR` is unset, so a generated unit-test binary
# aborts during `nextest --list`. Disable the test/doctest targets: correctness
# is validated by integrated preload runs, not by an in-process harness.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
detcore = { version = "0.0.0", path = "../detcore" }
libc = "0.2.186"
reverie-liteinst = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "26ffc1a6a5a13da92bb70bc0caac6b8d8524deb9", default-features = false }
