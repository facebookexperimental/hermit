[package]
name = "detcore-liteinst"
description = "In-guest LiteInst runtime for Detcore, the Hermit deterministic execution engine."
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

# This crate is a preload runtime, not a testable library. Its `.init_array`
# constructor (src/lib.rs) runs before any Rust test harness and `_exit(127)`s
# when `REVERIE_LITEINST_COORDINATOR` is unset, so a generated unit-test binary
# would abort during `nextest --list`. The test and doctest targets are
# disabled: hermit-cli's in-guest CLI tests run it as a real preload.
[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# Real-runtime allocation regression; never selects a different allocator.
allocator-fixture = ["reverie-liteinst/allocator-fixture"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.4.0", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "e8b2e94967d9bb60ddea05bf488b733057926e04" }
reverie-inguest = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "e8b2e94967d9bb60ddea05bf488b733057926e04", default-features = false }
reverie-liteinst = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "e8b2e94967d9bb60ddea05bf488b733057926e04", default-features = false }
