[workspace]
resolver = "3"
members = ["runtime"]
default-members = ["."]

[package]
name = "hermit-liteinst-runtime-build"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Adds only the nested leaf's diagnostic exports, never allocator selection.
allocator-fixture = []

[build-dependencies]
reverie-liteinst-artifact = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9bff68ac24c4e0a41a39bab2c6e6f14f3d0acf40", default-features = false }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
