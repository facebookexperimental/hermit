[workspace]
resolver = "3"
members = ["runtime"]
default-members = ["."]

# Same one-hash rule as the Hermit root (Reverie pin-flow design,
# Finding 3): Reverie by path into the `reverie` submodule, `version =`
# kept for publishing. Paths are relative to this nested root.
[workspace.dependencies]
reverie-inguest = { path = "../reverie/reverie-inguest", version = "0.5.7", default-features = false }
reverie-liteinst-artifact = { path = "../reverie/reverie-liteinst-artifact", version = "0.5.7", default-features = false }
reverie-liteinst-preload = { path = "../reverie/reverie-liteinst-preload", version = "0.5.7", default-features = false }

[package]
name = "hermit-liteinst-runtime-build"
version = "0.5.7"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Adds only the nested leaf's diagnostic exports, never allocator selection.
allocator-fixture = []
# Build-only actual native runtime; never links a guest constructor into host.
native-exec = ["dep:detcore-model", "dep:reverie-inguest", "dep:goblin", "dep:sha2"]

[build-dependencies]
reverie-liteinst-artifact = { workspace = true }
serde_json = "1.0.151"

detcore-model = { version = "0.5.7", path = "../detcore-model", features = ["native-exec"], optional = true }
reverie-inguest = { workspace = true, features = ["exec-native-injection"], optional = true }
goblin = { version = "0.10.7", optional = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
