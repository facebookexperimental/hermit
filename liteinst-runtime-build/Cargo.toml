[workspace]
resolver = "3"
members = ["runtime"]
default-members = ["."]

[package]
name = "hermit-liteinst-runtime-build"
version = "0.4.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Adds only the nested leaf's diagnostic exports, never allocator selection.
allocator-fixture = []

[build-dependencies]
reverie-liteinst-artifact = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "1d20e4f25ae32776482eae2083b66cc60c066133", default-features = false }
serde_json = "1.0.151"

[dev-dependencies]
serde_json = "1.0.151"
