[workspace]
resolver = "3"
members = ["runtime"]
default-members = ["."]

[package]
name = "hermit-liteinst-runtime-build"
version = "0.5.1"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[features]
# Adds only the nested leaf's diagnostic exports, never allocator selection.
allocator-fixture = []
# Build-only actual native runtime; never links a guest constructor into host.
native-exec = ["dep:detcore-model", "dep:reverie-inguest", "dep:goblin", "dep:sha2"]

[build-dependencies]
reverie-liteinst-artifact = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "e3634c5119f365406362ee57ddcc684bd45a813e", default-features = false }
serde_json = "1.0.151"

detcore-model = { version = "0.5.1", path = "../detcore-model", features = ["native-exec"], optional = true }
reverie-inguest = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "e3634c5119f365406362ee57ddcc684bd45a813e", default-features = false, features = ["exec-native-injection"], optional = true }
goblin = { version = "0.10.7", optional = true }
sha2 = { version = "0.10.9", optional = true }

[dev-dependencies]
serde_json = "1.0.151"
