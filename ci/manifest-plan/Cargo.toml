[package]
name = "hermit-manifest-plan"
version = "0.5.4"
edition = "2021"
publish = false
default-run = "hermit-manifest-plan"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dagrun = { version = "0.15.0", git = "https://github.com/rrnewton/agent-utils.git", rev = "f6b3ec4affcf630dc85195da575812d4c4dd34b5" }
detcore-model = { version = "0.5.4", path = "../../detcore-model" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
shell-words = "1.1.1"
libc = "0.2.186"

[dev-dependencies]
toml = "0.8.23"
