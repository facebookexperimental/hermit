# @generated by autocargo from //hermetic_infra/hermit/hermit-cli:[hermit,libhermit]

[package]
name = "hermit"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"

[lib]
crate-type = ["rlib", "cdylib"]

# Third-party-dependency execution backends are OFF by default so the shipped
# `hermit` binary is a single static binary with the ptrace/kvm/liteinst
# backends and no DynamoRIO/e9patch/SaBRe third-party dependencies. CI builds
# with `--features third-party-backends` to compile and test them. `dbi` is the
# only feature that adds Rust dependencies (detcore-dbi + reverie-dbi); `sabre`
# and `e9patch` shell out to external artifacts at runtime and only gate their
# in-crate dispatch code.
[features]
default = []
dbi = ["dep:detcore-dbi", "dep:reverie-dbi"]
sabre = []
e9patch = []
third-party-backends = ["dbi", "sabre", "e9patch"]

[dependencies]
anyhow = "1.0.103"
bincode = { version = "2", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
colored = "2.1.0"
detcore = { version = "0.0.0", path = "../detcore" }
detcore-dbi = { version = "0.0.0", path = "../detcore-dbi", optional = true }
diff = "0.1.13"
digest = { version = "0.0.0", path = "../common/digest" }
dirs = "6.0"
edit-distance = { version = "0.0.0", path = "../common/edit-distance" }
fbinit = { version = "0.2.0", git = "https://github.com/facebookexperimental/rust-shed.git", branch = "main" }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
hermit-resources = { version = "0.0.0", path = "../hermit-resources" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
libc = "0.2.186"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
num_cpus = "1.16"
pretty_assertions = { version = "1.4.1", features = ["alloc"], default-features = false }
rand = "0.10.2"
rand_pcg = { version = "0.10.2", features = ["serde"] }
regex = "1.13.1"
# Reverie is pinned to a specific commit for reproducibility. Keep this rev in
# sync across all crates and bump it via docs/updating-reverie.md.
reverie = { package = "reverie-core", version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c" }
reverie-dbi = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c", default-features = false, optional = true }
reverie-kvm = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c" }
reverie-ptrace = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c" }
reverie-liteinst = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c", default-features = false }
reverie-rpc-transport = { version = "0.2.0", git = "https://github.com/rrnewton/reverie.git", rev = "028fe52338081426a3b532ce6cb45a81e953156c" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
shell-words = "1.1.1"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
uuid = { version = "1.24.0", features = ["rng-getrandom", "serde", "v4", "v5", "v6", "v7", "v8"] }
