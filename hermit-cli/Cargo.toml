# @generated by autocargo from //hermetic_infra/hermit/hermit-cli:[hermit,libhermit]

[package]
name = "hermit"
description = "Hermit: a deterministic Linux execution engine for reproducible runs, record and replay, and concurrency-race search."
version = "0.4.1"
edition = "2024"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/hermit-run"
keywords = ["linux", "hermit", "determinism", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing"]
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"

[lib]
crate-type = ["rlib", "cdylib"]

# Third-party-dependency and experimental execution backends are OFF by default
# so the shipped `hermit` binary includes the ptrace and KVM backends
# without DynamoRIO/e9patch/SaBRe/LiteInst dependencies. CI builds
# with `--features third-party-backends` to compile and test them. `dbt` adds
# detcore-dbt + reverie-dbt and `liteinst` adds reverie-liteinst (and through it
# liteinst2); `sabre` and `e9patch` shell out to external artifacts at runtime
# with SaBRe's Rust RPC/statistics support selected only by `sabre`. LiteInst is
# left out of the default build because its architecture is not settled (see the 2026-10-02
# patching-backends architecture audit); every validation still builds it
# through `third-party-backends`.
[features]
default = []
# Native controls exercise real KVM ownership/RPC helpers without a VM.
kvm-native-test-support = ["reverie-kvm/native-test-support"]
dbt = ["dep:detcore-dbt", "dep:reverie-dbt", "dep:hermit-test-workdir"]
sabre = ["dep:reverie-rpc-transport", "dep:reverie-sabre-stats"]
e9patch = []
liteinst = ["dep:reverie-liteinst", "dep:reverie-rpc-transport"]
third-party-backends = ["dbt", "sabre", "e9patch", "liteinst"]
# Hardware qualification selected only by the existing KVM validation nodes.
kvm-execution-tests = []

[dependencies]
anyhow = "1.0.103"
bincode = { version = "2", features = ["serde"] }
addr2line = "0.26.1"
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
colored = "2.1.0"
detcore = { package = "hermit-detcore", version = "0.4.1", path = "../detcore" }
detcore-dbt = { version = "0.4.0", path = "../detcore-dbt", optional = true }
detcore-model = { version = "0.4.1", path = "../detcore-model" }
diff = "0.1.13"
dirs = "6.0"
fbinit = { version = "0.2.0", git = "https://github.com/facebookexperimental/rust-shed.git", branch = "main" }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
hermit-resources = { version = "0.4.1", path = "../hermit-resources" }
hermit-test-workdir = { version = "0.4.1", path = "../common/test-workdir", optional = true }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder"] }
libc = "0.2.186"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
num_cpus = "1.16"
object = { version = "0.40.0", features = ["read"] }
pretty_assertions = { version = "1.4.1", features = ["alloc"], default-features = false }
rand = "0.10.2"
rand_pcg = { version = "0.10.2", features = ["serde"] }
regex = "1.13.1"
# Reverie is pinned to a specific commit for reproducibility. Keep this rev in
# sync across all crates and bump it via docs/updating-reverie.md.
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216" }
reverie-dbt = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216", default-features = false, optional = true }
reverie-kvm = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216" }
reverie-ptrace = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216" }
reverie-liteinst = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216", default-features = false, optional = true }
reverie-rpc-transport = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216", optional = true }
reverie-sabre-stats = { version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "9d2eaaf69a7dfa39824a8b9ec50b45b51a17a216", optional = true }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
serde_yaml = "0.9.34"
shell-words = "1.1.1"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
uuid = { version = "1.24.0", features = ["rng-getrandom", "serde", "v4", "v5", "v6", "v7", "v8"] }

[dev-dependencies]
# Exact token locations and digests bind the complete source inventory.
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
ruzstd = "0.9.0"
sha2 = "0.10.9"
# Parse actual container call arguments, including conditional local labels.
syn = { version = "2.0.119", features = ["full", "visit"] }

# Always selected with the existing backend feature; fixture exports are a
# separate producer input, never an exemption from required execution.
[[test]]
name = "liteinst_allocator"
required-features = ["liteinst"]

[[test]]
name = "liteinst_stacks"
required-features = ["liteinst"]
