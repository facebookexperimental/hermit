[package]
name = "hermit-record"
description = "Hermit's ptrace recording tool, compiled apart from the hermit library so its Detcore instantiation builds in parallel."
version = "0.5.7"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
hermit-record-format = { version = "0.5.7", path = "../hermit-record-format" }
bincode = { version = "2", features = ["serde"] }
detcore = { package = "hermit-detcore", version = "0.5.7", path = "../detcore" }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "10c4c1b7266819bb55c00d18603f62ff82c9acb0" }
reverie-ptrace = { version = "0.5.7", git = "https://github.com/rrnewton/reverie.git", rev = "10c4c1b7266819bb55c00d18603f62ff82c9acb0" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
tempfile = "3.27.0"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
