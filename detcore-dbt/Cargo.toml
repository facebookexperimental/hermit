[package]
name = "detcore-dbt"
description = "DynamoRIO DBT backend glue for Detcore, the Hermit deterministic execution engine."
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.4.0", path = "../detcore" }
hermit-resources = { version = "0.4.0", path = "../hermit-resources" }
libc = "0.2.186"
rand = "0.10.2"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "4bfe8b8f44bd9992f6ae3f8f4df0fdfb4b334bfd" }
reverie-dbt = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "4bfe8b8f44bd9992f6ae3f8f4df0fdfb4b334bfd", default-features = false }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tracing = "0.1.41"
