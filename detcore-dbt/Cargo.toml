[package]
name = "detcore-dbt"
description = "DynamoRIO DBT backend glue for Detcore, the Hermit deterministic execution engine."
version = "0.4.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

# libdetcore_dbt.so is built by detcore-dbt-cdylib, so this crate stays an rlib
# and its dependents can start from its metadata.
[lib]
crate-type = ["rlib"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.4.0", path = "../detcore" }
hermit-resources = { version = "0.4.0", path = "../hermit-resources" }
libc = "0.2.186"
rand = "0.10.2"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "5a38b0f755652b59179a6e8d5ac9e590045d1301" }
reverie-dbt = { version = "0.4.0", git = "https://github.com/rrnewton/reverie.git", rev = "5a38b0f755652b59179a6e8d5ac9e590045d1301", default-features = false }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tracing = "0.1.41"
