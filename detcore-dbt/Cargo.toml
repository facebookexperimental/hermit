[package]
name = "detcore-dbt"
description = "DynamoRIO DBT backend glue for Detcore, the Hermit deterministic execution engine."
version = "0.5.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

# libdetcore_dbt.so is built by detcore-dbt-cdylib, so this crate stays an rlib
# and its dependents can start from its metadata.
[lib]
crate-type = ["rlib"]

[dependencies]
detcore = { package = "hermit-detcore", version = "0.5.1", path = "../detcore" }
hermit-resources = { version = "0.5.1", path = "../hermit-resources" }
libc = "0.2.186"
rand = "0.10.2"
reverie = { package = "reverie-core", version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "0788cb09b05af851704a7b9ce7a2a86882ef4d51" }
reverie-dbt = { version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "0788cb09b05af851704a7b9ce7a2a86882ef4d51", default-features = false }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tracing = "0.1.41"
