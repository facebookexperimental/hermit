nextest-version = "0.9.100"

[profile.default]
fail-fast = false
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
# Individual test processes use the owner-approved wall backstop derived from
# the completing data-handling/dd-partial-transfers observation:
# ceil(4 * 14.019s) = 57s. This remains alongside the manifest runner's CPU
# budget because a wedged process can consume no CPU. Machine-specific wall
# scaling from HERMIT_TEST_WALL_TIMEOUT_MULTIPLIER and the per-execution CPU
# budget/measurement wrapper are added to a temporary copy of this canonical file by
# ci/run-nextest-counted.sh.
slow-timeout = { period = "57s", terminate-after = 1, grace-period = "2s" }
global-timeout = "60m"

[profile.ci]
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Cargo runs integration test binaries one after another, and these binaries
# also use process-local mutexes to serialize Hermit executions. Nextest runs
# each test in a separate process, so keep their shared contract explicit.
#
# The `cli` binary is outside the group. Its HERMIT_RUN_LOCK is a
# process-local mutex, so under nextest it never serialized two tests; while
# the binary was in the group, the group (and test.cli's -j 1) did. Every
# fixture the binary writes under CARGO_TARGET_TMPDIR, including those in the
# tests/common modules it includes, therefore goes in a directory named for
# the test process (process_build_root), so two tests running at once never
# write, or run, the same file. test.cli and its hosted twin test.cli_on_host
# run at the width the DAG assigns through NEXTEST_TEST_THREADS; every other
# node that runs the cli binary passes -j 1.
#
# The `rr_suite` binary is outside the group too. Each of its tests runs one rr
# program in a fresh scratch directory, compiles that program into, and
# generates rr's headers into, a directory named for the test process
# (process_build_root), and retries a typed PMU skid refusal on its own.
# test.rr_suite_contract runs it with -j 8 (measured 2026-10-15: 171-179 s at
# -j 1, 31-40 s at -j 8, every one of 192 tests passing in every run); its
# hosted twin keeps -j 1.
#
# The `record_replay` binary is outside it as well: each test records into its
# own tempdir and runs prepared, read-only workloads, and test.record_replay
# runs eight at a time (measured 2026-10-15: 390 s at -j 1, 40-48 s at -j 8).
# ci/nextest-timeout-config.rs accepts exactly this filter.
[test-groups.hermit-serialized]
max-threads = 1

[[profile.default.overrides]]
filter = "package(=hermit) & kind(=test) & !binary(=cli) & !binary(=rr_suite) & !binary(=record_replay)"
test-group = "hermit-serialized"

# Stopgap for https://github.com/rrnewton/hermit/issues/3827. `hermit record
# start --verify-with-gdbex` binds its replay gdbserver to host port
# 16384 + tid % 1024 (record_start.rs), so two such replays running at once can
# pick the same port. These two cli tests are the only ones that reach that
# replay stage; the other --verify-with-gdbex cases fault during recording,
# before the port is chosen. The group keeps the two from overlapping each
# other. The general fix is a design item on that issue.
# ci/nextest-timeout-config.rs accepts exactly this filter too.
[test-groups.cli-gdbserver-port]
max-threads = 1

[[profile.default.overrides]]
filter = "package(=hermit) & binary(=cli) & (test(=record_classifies_a_gdbserver_replay_stage_container_child_failure) | test(=every_record_container_site_classifies_a_child_fault_by_name))"
test-group = "cli-gdbserver-port"
