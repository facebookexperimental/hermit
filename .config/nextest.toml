nextest-version = "0.9.100"

[profile.default]
fail-fast = false
test-threads = "num-cpus"
status-level = "pass"
final-status-level = "slow"
failure-output = "immediate-final"
success-output = "never"
slow-timeout = { period = "300s", terminate-after = 1, grace-period = "30s" }
global-timeout = "60m"

[profile.ci]
status-level = "slow"
final-status-level = "slow"

[profile.ci.junit]
path = "junit.xml"

# Cargo runs integration test binaries one after another, and these binaries
# also use process-local mutexes to serialize Hermit executions. Nextest runs
# each test in a separate process, so keep their shared contract explicit.
[test-groups.hermit-serialized]
max-threads = 1

# These stress/integration cases are intentionally slower than ordinary tests,
# but must still terminate as a process group rather than occupying a runner.
[[profile.default.overrides]]
filter = "test(/(mem_print_race|slow_cas_search_and_replay|record_replay_matrix|full_leveldb_suite_is_deterministic_under_strict)/)"
slow-timeout = { period = "600s", terminate-after = 1, grace-period = "30s" }

[[profile.default.overrides]]
filter = "package(=hermit) & kind(=test)"
test-group = "hermit-serialized"
