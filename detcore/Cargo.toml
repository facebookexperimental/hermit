[package]
name = "hermit-detcore"
description = "Detcore: the deterministic scheduler and syscall determinization core of the Hermit execution engine."
version = "0.5.1"
edition = "2024"
readme = "README.md"
homepage = "https://hermetic-infra.org"
documentation = "https://docs.rs/hermit-detcore"
keywords = ["linux", "hermit", "determinism", "debugging"]
categories = ["development-tools::debugging", "development-tools::testing"]
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"
# The integration tests are the hermit-detcore-tests package; nothing under
# tests/ is a target of this one.
autotests = false

# The public package uses the available crates.io name, while the Rust library
# keeps the established `detcore` import name for all consumers.
[lib]
name = "detcore"

[[bin]]
name = "syscaller"
path = "scripts/syscaller.rs"

[features]
# Explicit diagnostics only; absent from ordinary artifacts.
dispatch-observer = []
# Host-only physical cancellation rendezvous; never a runtime Config switch.
physical-mm-test-support = []

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.86"
bincode = { version = "2", features = ["serde"] }
bitflags = { version = "2.13.1", features = ["serde"], default-features = false }
chrono = { version = "0.4.45", features = ["clock", "serde", "std"], default-features = false }
clap = { version = "4.6.2", features = ["derive", "env", "string", "unicode", "wrap_help"] }
detcore-model = { version = "0.5.1", path = "../detcore-model" }
futures = { version = "0.3.31", features = ["async-await", "compat"] }
hex = { version = "0.4.3", features = ["alloc"] }
libc = "0.2.186"
nix = { version = "0.30.1", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }
pretty = "0.12.5"
pretty_assertions = { version = "1.4.1", features = ["alloc"], default-features = false }
procfs = "0.18.0"
rand = "0.10.2"
rand_distr = "0.6"
rand_pcg = { version = "0.10.2", features = ["serde"] }
raw-cpuid = "10.7.0"
regex = "1.13.1"
# Abstract Reverie interface ONLY. Never add a concrete backend here (see the
# BACKEND-ABSTRACTION COMMANDMENT at the top of this file).
reverie = { package = "reverie-core", version = "0.5.1", git = "https://github.com/rrnewton/reverie.git", rev = "bc87651747f1daf371da9651e0e0ce0a90a404e9" }
ruzstd = "0.9.0"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
sha2 = "0.10.6"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }

[dev-dependencies]
# Only the unit tests in src/ build against these. The integration tests and
# their dependencies (detcore-testutils, reverie-ptrace, test-allocator) are
# the hermit-detcore-tests package, so this package's unit-test binary no
# longer waits for the whole library through detcore-testutils, which depends
# on it, nor links a second copy of it.
test-case = "3.3.1"

# Unit controls use the same native formatter as the CLI.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
