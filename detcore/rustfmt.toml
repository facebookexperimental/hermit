# Formatting is checked with the dedicated formatter toolchain pinned
# in ci/rustfmt-toolchain.toml (see the lint.rustfmt DAG step), not with
# the stable compiler pin: the nightly-only options below are silently
# ignored by stable rustfmt.
# Get help on options with `rustfmt --help=config`
# Please keep these in alphabetical order.
edition = "2021"
format_code_in_doc_comments = true
group_imports = "StdExternalCrate"
imports_granularity = "Item"
merge_derives = false
style_edition = "2024"
use_field_init_shorthand = true
