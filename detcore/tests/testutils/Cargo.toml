[package]
name = "detcore-testutils"
description = "Test utilities for Detcore integration tests in the Hermit deterministic execution engine."
version = "0.5.7"
edition = "2024"
repository = "https://github.com/facebookexperimental/hermit"
license = "BSD-3-Clause"
publish = false

[features]
nightly = []

[dependencies]
libc = "0.2.186"
hermit-test-workdir = { version = "0.5.7", path = "../../../common/test-workdir" }
detcore = { package = "hermit-detcore", version = "0.5.7", path = "../.." }
pretty_assertions = { version = "1.4.1", features = ["alloc"], default-features = false }
reverie-core = { workspace = true }
reverie-ptrace = { workspace = true }
test-allocator = { version = "0.5.7", path = "../../../common/test-allocator" }
tokio = { version = "1.54.1", features = ["full", "test-util", "tracing"] }
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "json", "local-time", "parking_lot", "registry"] }
