# Hand-maintained, not generated by autocargo: internal Hermit builds these
# programs with the rust_lit_unittest rule in detcore/tests/lit/build_defs.bzl.

[package]
name = "hermit-lit-guests"
version = "0.5.4"
edition = "2021"
description = "The Rust programs detcore/tests/lit's fixtures run as %me, for hermit-cli/tests/lit.rs."
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[[bin]]
name = "lit_chaos_schedule_replay"
path = "../lit/chaos_schedule_replay/main.rs"
test = false

[[bin]]
name = "lit_child_should_inherit_fds"
path = "../lit/child_should_inherit_fds/main.rs"
test = false

[[bin]]
name = "lit_close_on_exec"
path = "../lit/close_on_exec/main.rs"
test = false

[[bin]]
name = "lit_dup2_existing_fd"
path = "../lit/dup2_existing_fd/main.rs"
test = false

[[bin]]
name = "lit_dup_should_create_a_valid_fd"
path = "../lit/dup_should_create_a_valid_fd/main.rs"
test = false

[[bin]]
name = "lit_fcntl_dupfd"
path = "../lit/fcntl_dupfd/main.rs"
test = false

[[bin]]
name = "lit_fcntl_getfd_setfd"
path = "../lit/fcntl_getfd_setfd/main.rs"
test = false

[[bin]]
name = "lit_file_race_openwrite"
path = "../lit/file_race_openwrite/main.rs"
test = false

[[bin]]
name = "lit_file_write_race"
path = "../lit/file_write_race/main.rs"
test = false

[[bin]]
name = "lit_fstat"
path = "../lit/fstat/main.rs"
test = false

[[bin]]
name = "lit_hello_world_rs"
path = "../lit/hello_world_rs/main.rs"
test = false

[[bin]]
name = "lit_no_close_on_exec"
path = "../lit/no_close_on_exec/main.rs"
test = false

[[bin]]
name = "lit_open_null_ptr"
path = "../lit/open_null_ptr/main.rs"
test = false

[[bin]]
name = "lit_openat_lowest_fd"
path = "../lit/openat_lowest_fd/main.rs"
test = false

[[bin]]
name = "lit_openat_next_lowest_fd"
path = "../lit/openat_next_lowest_fd/main.rs"
test = false

[[bin]]
name = "lit_pipe_creates_valid_fds"
path = "../lit/pipe_creates_valid_fds/main.rs"
test = false

[[bin]]
name = "lit_print_race"
path = "../lit/print_race/main.rs"
test = false

[[bin]]
name = "lit_read_badfd"
path = "../lit/read_badfd/main.rs"
test = false

[[bin]]
name = "lit_sched_getaffinity"
path = "../lit/sched_getaffinity/main.rs"
test = false

[[bin]]
name = "lit_utime"
path = "../lit/utime/main.rs"
test = false

[[bin]]
name = "lit_utimes"
path = "../lit/utimes/main.rs"
test = false

[dependencies]
close-err = "1.0.2"
libc = "0.2.186"
nix = { version = "0.30.1", features = ["fs", "process", "sched", "signal"] }
syscalls = "0.6.18"
tempfile = "3.27.0"

# The programs are the fixtures internal Hermit shares, not code written for
# this package. close_on_exec and no_close_on_exec spell a C string as
# "...\0" bytes, the only finding of `cargo clippy -D warnings` here.
[lints.clippy]
manual_c_str_literals = "allow"
