[package]
name = "hermit-record-format"
description = "Record/replay event format and support shared by Hermit's record and replay paths."
version = "0.4.1"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/facebookexperimental/hermit"
publish = false

[dependencies]
bincode = { version = "2", features = ["serde"] }
detcore = { package = "hermit-detcore", version = "0.4.1", path = "../detcore" }
goblin = { version = "0.10.7", features = ["elf32", "elf64", "endian_fd"] }
libc = "0.2.186"
reverie = { package = "reverie-core", version = "0.4.1", git = "https://github.com/rrnewton/reverie.git", rev = "8ebc1ae72bfeaa4ae127ece2d108156092f884fd" }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = { version = "1.0.140", features = ["alloc", "float_roundtrip", "raw_value", "unbounded_depth"] }
tempfile = "3.27.0"
tracing = { version = "0.1.41", features = ["attributes", "valuable"] }
